<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiếng Anh lớp 5</title>
<style>
:root{--bg:#f3f6ff;--card:#fff;--ink:#1e293b;--mut:#64748b;--pri:#6366f1;--pri2:#8b5cf6;--ok:#10b981;--bad:#ef4444;--line:#e2e8f0;--soft:#eef2ff;--shadow:0 4px 14px rgba(99,102,241,.10)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#171d33;--ink:#e8ecf8;--mut:#9aa6c4;--line:#2a3354;--soft:#222a4a;--shadow:0 4px 14px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito",-apple-system,system-ui,sans-serif}
header{background:linear-gradient(135deg,var(--pri),var(--pri2) 60%,#ec4899);color:#fff;padding:20px 16px 56px;border-radius:0 0 28px 28px}
.hin{max-width:760px;margin:0 auto}
h1{margin:0 0 12px;font-size:26px;letter-spacing:-.3px}
header select{width:100%;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px);font-weight:600}
header select option{color:#111}
#prog{display:block;margin-top:8px;font-size:14px;opacity:.9}
#pbar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:6px;overflow:hidden}
#pbar i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .3s}
nav{display:flex;gap:6px;max-width:728px;margin:-30px auto 0;padding:6px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:5;width:calc(100% - 32px)}
nav button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:12px;font-weight:700;color:var(--mut);font-size:14px}
nav button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 3px 8px rgba(99,102,241,.4)}
main{max-width:760px;margin:0 auto;padding:6px 16px 48px}
select,button{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;cursor:pointer;transition:transform .08s,box-shadow .15s}
button:active{transform:scale(.96)}
button:disabled{opacity:.6;cursor:default}
button.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;font-weight:700;box-shadow:0 3px 8px rgba(99,102,241,.35)}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.emo{font-size:34px;width:54px;height:54px;display:grid;place-items:center;background:var(--soft);border-radius:16px}
.big{font-size:26px;font-weight:800}
.mut{color:var(--mut)}
h3{margin:22px 4px 0;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--pri)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opts button{padding:14px;font-weight:700;border-width:2px}
.ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
.bad{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
.chip{display:inline-block;margin:4px;padding:9px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;cursor:pointer}
.tip{font-size:14px;margin-top:8px}
.known{opacity:.55}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.sent{padding:10px 12px;border-radius:12px;cursor:pointer;margin:2px 0}
.sent:hover{background:var(--soft)}
.sent.now{background:var(--soft);outline:2px solid var(--pri)}
.sent .vi{color:var(--mut);font-size:14px;display:none}
.showvi .sent .vi{display:block}
.pill{display:inline-block;background:var(--soft);color:var(--pri);padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700}
.tf{display:flex;gap:8px;margin-top:8px}.tf button{flex:1;font-weight:700;border-width:2px}
</style>
</head>
<body>
<header><div class="hin">
  <h1>🇬🇧 Tiếng Anh lớp 5</h1>
  <select id="unit"></select>
  <span id="prog"></span>
  <div id="pbar"><i></i></div>
</div></header>
<nav id="tabs"></nav>
<main id="view"></main>

function warn(msg){
  let el = document.getElementById('ttswarn');
  if(!el){ el = document.createElement('div'); el.id='ttswarn'; el.className='card'; el.style.cssText='position:fixed;left:16px;right:16px;bottom:16px;z-index:9;border:2px solid var(--bad)'; document.body.appendChild(el); }
  el.innerHTML = msg + ' <button onclick="this.parentNode.remove()">Đóng</button>';
}
const cyrb53=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const clipUrl = t => "audio-en/" + cyrb53("en|"+t).toString(36) + ".m4a";
let curA = null, playTok = 0;
// Đọc một danh sách câu lần lượt bằng file thu sẵn (audio-en/, giọng Samantha).
// cb(i) được gọi khi bắt đầu câu i, done() khi đọc xong.
function speakList(texts, cb, done){
  const tok = ++playTok;
  if(curA){ try{ curA.pause(); }catch(e){} curA = null; }
  let i = 0;
  const next = () => {
    if(tok !== playTok) return;
    if(i >= texts.length){ if(done) done(); return; }
    const k = i++, t = texts[k];
    if(cb) cb(k);
    const a = new Audio(clipUrl(t)); curA = a;
    let used = false;
    const fallback = () => { if(used || tok !== playTok) return; used = true; warn('Không tải được âm thanh. Hãy mở trang cùng chỗ với thư mục audio-en.'); };
    a.onerror = fallback;
    a.onended = () => { if(!used && tok === playTok){ used = true; next(); } };
    const pr = a.play();
    if(pr && pr.catch) pr.catch(e => { if(e && e.name === 'NotAllowedError'){ used = true; warn('Trình duyệt chặn âm thanh, hãy bấm lại nút nghe.'); } else fallback(); });
  };
  next();
}

function init(){

  $('#unit').onchange = e => { unit = +e.target.value; pi = 0; store.set('en5.unit', unit); render(); };
  $('#tabs').innerHTML = TABS.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('');
  $('#tabs').onclick = e => { const k = e.target.dataset.k; if(k){ tab = k; store.set('en5.tab', k); render(); } };
  render();
}

function render(){
  if(!UNITS[unit] && tab!=='read' && tab!=='speak') tab='read';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === tab));
  const u = UNITS[unit] || {vocab:[]};
  const n = u.vocab.filter(v => known[unit+':'+v[0]]).length;
  $('#prog').textContent = `Đã thuộc ${n}/${u.vocab.length} từ` + (stars[unit] != null ? ` · Bài tập cao nhất ${stars[unit]}%` : '');
  $('#pbar i').style.width = (u.vocab.length ? n/u.vocab.length*100 : 0)+'%';
  if(!UNITS[unit]) $('#prog').textContent = 'Đoạn văn luyện đọc: nghe, đọc thử và chấm điểm';
  ({vocab:viewVocab, read:viewRead, talk:viewTalk, quiz:viewQuiz, speak:viewSpeak})[tab]();
}

function buildQuiz(){
  const u = UNITS[unit];
  const allV = UNITS.flatMap(x => x.vocab);
  const single = u.vocab.filter(v => !v[0].includes(' '));
  const qs = [];
  const others = (pred, n) => shuffle(allV.filter(pred));
  // 1. chọn nghĩa
  shuffle(u.vocab).slice(0,2).forEach(v => {
    const wrong = others(x => x[1] !== v[1]).slice(0,3).map(x=>x[1]);
    qs.push({type:'mean', q:`"${v[0]}" nghĩa là gì?`, say:v[0], ans:v[1], opts:shuffle([v[1],...wrong])});
  });
  // 2. nhìn hình chọn từ
  shuffle(u.vocab).slice(0,2).forEach(v => {
    const wrong = others(x => x[0] !== v[0] && x[2] !== v[2]).slice(0,3).map(x=>x[0]);
    qs.push({type:'pic', q:'Hình này là gì?', big:v[2], say:v[0], ans:v[0], opts:shuffle([v[0],...wrong])});
  });
  // 3. nghe chọn hình
  shuffle(u.vocab).slice(0,1).forEach(v => {
    const wrong = others(x => x[2] !== v[2]).slice(0,3).map(x=>x[2]);
    qs.push({type:'picw', q:'Nghe và chọn hình đúng', say:v[0], ans:v[2], opts:shuffle([v[2],...wrong]), auto:true, emo:true});
  });
  // 3b. Việt → Anh
  shuffle(u.vocab).slice(0,2).forEach(v => {
    const wrong = others(x => x[0] !== v[0]).slice(0,3).map(x=>x[0]);
    qs.push({type:'viEn', q:`"${v[1]}" tiếng Anh là gì?`, say:v[0], ans:v[0], opts:shuffle([v[0],...wrong])});
  });
  // 3c. nghe từ Anh → chọn nghĩa Việt
  shuffle(u.vocab).slice(0,2).forEach(v => {
    const wrong = others(x => x[1] !== v[1]).slice(0,3).map(x=>x[1]);
    qs.push({type:'hearvi', q:'Nghe từ tiếng Anh và chọn nghĩa tiếng Việt', say:v[0], ans:v[1], opts:shuffle([v[1],...wrong]), auto:true});
  });
  // 4. nghe chọn từ
  shuffle(u.vocab).slice(0,1).forEach(v => {
    const wrong = others(x => x[0] !== v[0]).slice(0,3).map(x=>x[0]);
    qs.push({type:'listen', q:'Nghe và chọn từ đúng', say:v[0], ans:v[0], opts:shuffle([v[0],...wrong]), auto:true});
  });
  // 5. ghép chữ cái
  shuffle(single.filter(v => v[0].length <= 9)).slice(0,1).forEach(v => {
    const w = v[0].toLowerCase();
    qs.push({type:'order', sep:'', q:`Xếp chữ cái: ${v[2]} ${v[1]}`, ans:w, words:shuffle(w.split('')), say:v[0]});
  });
  // 6. điền từ vào câu
  const pool = [...u.patterns.map(p=>p[0]), ...u.talk.map(l=>l[1]), ...u.sentences.map(x=>x+'.'), ...getR(unit).sents.map(x=>x[0])];
  const fills = [];
  shuffle(single.filter(v => v[0].length > 2)).forEach(v => {
    const re = new RegExp('\\b' + v[0] + '\\b', 'i');
    const sent = shuffle(pool).find(x => re.test(x));
    if(sent) fills.push({v, sent});
  });
  fills.slice(0,2).forEach(({v, sent}) => {
    const wrong = shuffle(single.filter(x => x[0] !== v[0])).slice(0,3).map(x=>x[0].toLowerCase());
    const ans = v[0].toLowerCase();
    qs.push({type:'fill', q:'Chọn từ điền vào chỗ trống', big:'', text:sent.replace(new RegExp('\\b' + v[0] + '\\b','i'), '_____'), say:sent, ans, opts:shuffle([ans,...wrong])});
  });
  // 7. sắp xếp câu
  shuffle(u.sentences).slice(0,2).forEach(x => {
    qs.push({type:'order', sep:' ', q:'Sắp xếp thành câu đúng', ans:x, words:shuffle(x.split(' ')), say:x});
  });
  // 7b. dịch câu tiếng Việt rồi xếp từ tiếng Anh
  shuffle([...u.patterns, ...u.talk.map(l=>[l[1],l[2]])]).slice(0,2).forEach(([en, vi]) => {
    qs.push({type:'order', sep:' ', q:`Dịch sang tiếng Anh: “${vi}”`, ans:en, words:shuffle(en.split(' ')), say:en});
  });
  // 7c. xếp các câu thành đoạn đúng thứ tự
  const rs = getR(unit).sents.map(x=>x[0]), st = Math.max(0, Math.floor(Math.random()*(rs.length-3)));
  const part = rs.slice(st, st+4);
  if(part.length === 4) qs.push({type:'order', sep:' ', q:'Xếp các câu thành đoạn văn đúng thứ tự', ans:part.join(' '), words:shuffle(part), say:part.join(' '), part, long:true});
  // 8b. nối hình với từ
  const mp = shuffle(u.vocab).slice(0,4);
  qs.push({type:'match', q:'Nối hình với từ', left:mp.map(v=>v[2]), mean:mp.map(v=>v[0]), right:shuffle(mp.map((v,i)=>i)), done:[], sel:null, miss:0, sayMean:true, emo:true});
  // 8. nối từ với nghĩa
  const mv = shuffle(u.vocab).slice(0,4);
  qs.push({type:'match', q:'Nối từ với nghĩa', left:mv.map(v=>v[0]), mean:mv.map(v=>v[1]), right:shuffle(mv.map((v,i)=>i)), done:[], sel:null, miss:0});
  Q = {list:shuffle(qs), i:0, score:0, picked:[], unit};
}
function viewQuiz(){
  if(!Q || Q.unit !== unit){ buildQuiz(); }
  const q = Q.list[Q.i];
  if(!q){
    const pct = Math.round(Q.score / Q.list.length * 100);
    if(stars[unit] == null || pct > stars[unit]){ stars[unit] = pct; store.set('en5.stars2', stars); }
    $('#view').innerHTML = `<div class="card"><div class="big">${Q.score}/${Q.list.length} câu đúng · ${pct}% ${stars3(pct)}</div><p class="mut">${pct>=80?'Tuyệt vời! 🎉':pct>=50?'Khá tốt, thử lại để cao hơn nhé.':'Ôn lại từ vựng rồi làm lại nhé.'}</p><button class="pri" id="again">Làm lại (câu hỏi mới)</button></div>`;
    $('#view').onclick = e => { if(e.target.id==='again'){ Q=null; viewQuiz(); } };
    render_prog();
    return;
  }
  let body = `<div class="mut">Câu ${Q.i+1}/${Q.list.length}</div><div class="bar"><i style="width:${Q.i/Q.list.length*100}%"></i></div><div class="card"><div class="big" style="font-size:20px">${q.q}</div>`;
  if(q.big) body += `<div style="font-size:72px;text-align:center;margin:6px 0">${q.big}</div>`;
  if(q.text) body += `<div style="font-size:20px;margin:10px 0">${q.text}</div>`;
  if(q.type === 'order'){
    Q.picked = Q.picked.filter(x => typeof x === 'number');
    body += `<div style="min-height:40px;margin-top:8px;font-size:${q.long?16:22}px;font-weight:700">${Q.picked.map(i=>q.words[i]).join(q.sep)}</div><div>${q.words.map((w,i)=>`<span class="chip" data-w="${i}" style="${q.long?'display:block;':''}${Q.picked.includes(i)?'opacity:.3':''}">${w}</span>`).join('')}</div><div class="row" style="margin-top:8px"><button id="undo">↩︎ Xóa</button><button class="pri" id="check">Kiểm tra</button><button id="hear">🔊</button></div>`;
  } else if(q.type === 'match'){
    body += `<div class="row" style="align-items:flex-start;gap:12px"><div style="flex:1;display:grid;gap:8px">${q.left.map((w,i)=>`<button data-ml="${i}" class="${q.done.includes(i)?'ok':q.sel===i?'pri':''}" ${q.emo?'style="font-size:34px"':''} ${q.done.includes(i)?'disabled':''}>${w}</button>`).join('')}</div><div style="flex:1;display:grid;gap:8px">${q.right.map(j=>`<button data-mr="${j}" class="${q.done.includes(j)?'ok':''}" ${q.done.includes(j)?'disabled':''}>${q.mean[j]}</button>`).join('')}</div></div>`;
  } else {
    body += ((q.type==='listen'||q.type==='picw'||q.type==='hearvi') ? `<button id="hear">🔊 Nghe</button>` : '') + `<div class="opts">${q.opts.map(o=>`<button data-o="${o.replace(/"/g,'&quot;')}" ${q.emo?'style="font-size:40px"':''}>${o}</button>`).join('')}</div>`;
  }
  $('#view').innerHTML = body + `<div id="fb" class="tip"></div></div>`;
  if(q.auto) say(q.say);
  if(q.type === 'match' && q.done.length === q.left.length){ q.fin = true; next(); $('#fb').prepend(q.miss<=1 ? '✅ Giỏi lắm! ' : '❌ Cần luyện thêm. '); }
  $('#view').onclick = e => {
    const t = e.target.closest('button,.chip'); if(!t) return;
    const fb = $('#fb');
    if(t.id === 'hear') sayQ(q);
    if(t.dataset.o != null){
      const right = t.dataset.o === q.ans;
      t.classList.add(right?'ok':'bad');
      if(right) Q.score++; else document.querySelectorAll('[data-o]').forEach(b => { if(b.dataset.o===q.ans) b.classList.add('ok'); });
      if(q.type !== 'listen' && q.type !== 'picw' && q.type !== 'hearvi') say(q.say);
      next();
    }
    if(t.dataset.w != null){ const i = +t.dataset.w; if(!Q.picked.includes(i)){ Q.picked.push(i); viewQuiz(); } }
    if(t.id === 'undo'){ Q.picked.pop(); viewQuiz(); }
    if(t.id === 'check'){
      const got = Q.picked.map(i=>q.words[i]).join(q.sep);
      const right = got === q.ans;
      if(right) Q.score++;
      fb.innerHTML = right ? '✅ Chính xác!' : `❌ Đáp án: <b>${q.ans}</b>`;
      sayQ(q);
      next();
    }
    if(t.dataset.ml != null){ q.sel = +t.dataset.ml; viewQuiz(); }
    if(t.dataset.mr != null && q.sel != null){
      if(+t.dataset.mr === q.sel){ q.done.push(q.sel); say(q.sayMean ? q.mean[q.sel] : q.left[q.sel]); if(q.done.length === q.left.length && q.miss <= 1) Q.score++; }
      else q.miss++;
      q.sel = null; viewQuiz();
    }
  };
}
const sayQ = q => q.part ? speakList(q.part) : say(q.say);
function next(){
  document.querySelectorAll('#view button, #view .chip').forEach(b => b.disabled = true);
  const nb = document.createElement('button'); nb.className='pri'; nb.textContent='Tiếp →'; nb.style.marginTop='10px';
  nb.onclick = () => { Q.i++; Q.picked = []; viewQuiz(); };
  $('#fb').appendChild(nb); nb.disabled = false;
}
function render_prog(){ $('#prog').textContent = `Điểm cao nhất ${stars[unit]}%`; }

// ---------- luyện đọc ----------
const NUMW = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const toks = s => norm(s.replace(/\b(\d+)\b/g,(m,d)=>' '+(NUMW[+d]||d)+' ')).split(' ').filter(Boolean);
function lev(a,b){ const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; }
const eq = (a,b) => a===b || (a.length>3 && b.length>3 && lev(a,b)<=1);
// Gióng hàng theo thứ tự (LCS): trả về mảng true/false cho từng từ mẫu
function align(target, said){
  const n=target.length, m=said.length, L=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j] = eq(target[i],said[j]) ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  const hit=Array(n).fill(false); let i=0,j=0;
  while(i<n && j<m){ if(eq(target[i],said[j])){ hit[i]=true; i++; j++; } else if(L[i+1][j]>=L[i][j+1]) i++; else j++; }
  return hit;
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, rdScore = store.get('en5.rd', {});
function stopRec(){ if(rec){ try{ rec.abort(); }catch(e){} rec = null; } }
const markHtml = (words, hit) => words.map((w,i)=>`<span style="color:var(--${hit[i]?'ok':'bad'});font-weight:700">${w}</span>`).join(' ');
const stars3 = p => p>=90?'⭐⭐⭐':p>=70?'⭐⭐':p>=40?'⭐':'';

function listenOne(target, out, onScore){
  if(!SR) return;
  stopRec();
  rec = new SR(); rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
  out.textContent = '🎙️ Đang nghe…';
  rec.onresult = ev => {
    const said = toks(ev.results[0][0].transcript), words = target.split(' ');
    const hit = align(words.map(w=>norm(w)), said);
    const pct = Math.round(hit.filter(Boolean).length/words.length*100);
    out.innerHTML = `${markHtml(words,hit)}<div>${pct}% ${stars3(pct)} <span class="mut">· Bé nói: “${said.join(' ')}”</span></div>` + (pct<100?`<div class="mut">Nghe lại máy đọc rồi thử lần nữa nhé.</div>`:'<div>🎉 Rất tốt!</div>');
    if(onScore) onScore(pct);
  };
  rec.onerror = () => { out.textContent = 'Không nghe được, thử lại nhé.'; };
  rec.start();
}
const saveScore = (i, pct) => { const cur = rdScore[rk()]||[]; cur[i] = Math.max(cur[i]||0, pct); rdScore[rk()]=cur; store.set('en5.rd', rdScore); };

function viewSpeak(){
  stopRec();
  const u = UNITS[unit] || {patterns:[],talk:[]}, r = getR(unit);
  const saved = rdScore[rk()] || [];
  $('#view').innerHTML = (SR ? '' : `<div class="card">Trình duyệt này chưa hỗ trợ nhận dạng giọng nói. Hãy dùng Chrome hoặc Safari.</div>`) + passChips() + `
    <div class="card"><div class="row"><span class="pill">Bước 1</span><b style="flex:1">Đọc từng câu: ${r.title}</b></div>
    <div class="tip mut">Bấm 🔊 nghe mẫu, bấm 🎤 rồi đọc to câu đó. Từ xanh là đọc đúng, từ đỏ là chưa rõ.</div></div>` +
    r.sents.map((x,i)=>`<div class="card"><div class="row"><b style="flex:1;font-size:18px" id="t${i}">${x[0]}</b><button data-h="${i}">🔊</button><button class="pri" data-m="${i}">🎤 Đọc thử</button></div><div class="tip" id="r${i}">${saved[i]!=null?`Lần tốt nhất: ${saved[i]}% ${stars3(saved[i])}`:''}</div></div>`).join('') + `
    <div class="card"><div class="row"><span class="pill">Bước 2</span><b style="flex:1">Đọc liền cả đoạn</b></div>
    <div class="tip mut">Đọc một mạch từ đầu đến cuối, không dừng. Web chấm từng câu và đo tốc độ, số lần ngập ngừng.</div>
    <div id="wtext" style="font-size:20px;line-height:1.8;margin:12px 0;padding:12px 14px;background:var(--soft);border-radius:14px">${r.sents.map(x=>x[0]).join(' ')}</div>
    <div class="row" style="margin-top:10px"><button class="pri" id="whole">🎤 Đọc liền cả bài</button><button id="stopw" style="display:none">⏹ Xong</button></div>
    <div id="wres" class="tip"></div></div>
    ${u.patterns.length?'<h3>Mẫu câu và hội thoại</h3>':''}` +
    [...u.patterns.map(p=>p[0]), ...u.talk.map(l=>l[1])].map((s,i)=>`<div class="card"><div class="row"><b style="flex:1" id="pt${i}">${s}</b><button data-ph="${i}">🔊</button><button data-pm="${i}">🎤</button></div><div class="tip" id="pr${i}"></div></div>`).join('');
  const extra = [...u.patterns.map(p=>p[0]), ...u.talk.map(l=>l[1])];

  function readWhole(){
    if(!SR) return;
    stopRec();
    const all = r.sents.map(x=>x[0]);
    const words = all.flatMap(x=>x.split(' ')), tw = words.map(w=>norm(w));
    const owner = all.flatMap((x,i)=>x.split(' ').map(()=>i));
    let finals = [], t0 = null, tLast = null, gaps = 0, lastEnd = null;
    $('#wtext').style.display = ''; const res = $('#wres'); res.textContent = '🎙️ Đang nghe… đọc một mạch cả đoạn rồi bấm Xong.';
    $('#whole').style.display='none'; $('#stopw').style.display='';
    rec = new SR(); rec.lang='en-US'; rec.continuous=true; rec.interimResults=true;
    rec.onresult = ev => {
      const now = performance.now();
      if(t0 === null) t0 = now;
      if(lastEnd !== null && now-lastEnd > 1800) gaps++;
      lastEnd = now; tLast = now;
      finals = []; for(let i=0;i<ev.results.length;i++) finals.push(ev.results[i][0].transcript);
    };
    rec.onerror = () => {};
    const finish = () => {
      $('#whole').style.display=''; $('#stopw').style.display='none';
      const said = toks(finals.join(' '));
      if(!said.length){ res.textContent = 'Không nghe được gì, thử lại nhé.'; return; }
      const hit = align(tw, said);
      const per = all.map((_,i)=>{ const idx = owner.map((o,k)=>o===i?k:-1).filter(k=>k>=0); return Math.round(idx.filter(k=>hit[k]).length/idx.length*100); });
      const acc = Math.round(hit.filter(Boolean).length/tw.length*100);
      const mins = Math.max((tLast-t0)/60000, 0.05), wpm = Math.round(said.length/mins);
      const speedTxt = wpm<50 ? 'Hơi chậm, thử đọc trôi hơn.' : wpm>170 ? 'Hơi nhanh, đọc chậm lại để rõ từng từ.' : 'Tốc độ tốt.';
      const fluTxt = gaps===0 ? 'Không ngập ngừng.' : `${gaps} lần ngừng lâu, luyện lại các câu đỏ.`;
      let k=0; const html = all.map((s,i)=>{ const w=s.split(' '); const h=w.map((_,j)=>hit[k+j]); k+=w.length; return `<div style="margin:6px 0">${markHtml(w,h)} <span class="pill">${per[i]}%</span></div>`; }).join('');
      $('#wtext').style.display = 'none';
      res.innerHTML = `<div class="big" style="font-size:22px;margin-top:10px">${acc}% ${stars3(acc)}</div>${html}<div>⏱ Tốc độ: <b>${wpm}</b> từ/phút · ${speedTxt}</div><div>🗣 ${fluTxt}</div>`;
      const cur = rdScore[rk()] || []; per.forEach((p,i)=>{ cur[i] = Math.max(cur[i]||0, p); }); rdScore[rk()] = cur; store.set('en5.rd', rdScore);
    };
    rec.onend = () => { if(rec){ rec = null; finish(); } };
    rec.start();
  }

  $('#view').onclick = e => {
    const t = e.target.closest('button'); if(!t) return;
    if(t.dataset.pi != null){ pi = +t.dataset.pi; viewSpeak(); return; }
    if(t.dataset.h != null) say(r.sents[t.dataset.h][0]);
    if(t.dataset.ph != null) say(extra[t.dataset.ph]);
    if(t.dataset.m != null){ const i=+t.dataset.m; listenOne(r.sents[i][0], $('#r'+i), pct => saveScore(i, pct)); }
    if(t.dataset.pm != null){ const i=+t.dataset.pm; listenOne(extra[i], $('#pr'+i)); }
    if(t.id === 'whole') readWhole();
    if(t.id === 'stopw' && rec){ try{ rec.stop(); }catch(e){} }
  };
}

init();
</script>
