<title>Học Tiếng Trung 當代中文課程 1</title>
<style>
:root{
  --bg:#f6f1e8;--card:#fffdf9;--ink:#2a2622;--mut:#7c7267;--line:#eadfce;
  --pri:#b8372b;--pri-d:#8f2a22;--pri2:#fbe9e4;
  --acc:#1f7a74;--acc2:#e1f1ee;--gold:#c9972b;
  --ok:#2e8b57;--okbg:#e4f5ea;--bad:#c0392b;--badbg:#fdeae6;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 10px 28px -14px rgba(60,40,20,.28);
  --hero-bg:linear-gradient(135deg,#8f2a22 0%,#b8372b 55%,#d1593b 100%);
  --hanzi:"Songti TC","Noto Serif TC","PingFang TC","Hiragino Sans CNS",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#242120;--ink:#f2ede5;--mut:#a59c90;--line:#37322d;
  --pri:#f0705f;--pri-d:#c9483a;--pri2:#3a2824;
  --acc:#5cc6bc;--acc2:#1c3633;--gold:#e0b04a;
  --ok:#5cc88a;--okbg:#1e3427;--bad:#f0705f;--badbg:#3a2623;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark;--hero-bg:linear-gradient(135deg,#5a1f1a 0%,#82302a 60%,#9c4330 100%)}}
:root[data-theme="dark"]{--bg:#171513;--card:#242120;--ink:#f2ede5;--mut:#a59c90;--line:#37322d;
  --pri:#f0705f;--pri-d:#c9483a;--pri2:#3a2824;
  --acc:#5cc6bc;--acc2:#1c3633;--gold:#e0b04a;
  --ok:#5cc88a;--okbg:#1e3427;--bad:#f0705f;--badbg:#3a2623;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark;--hero-bg:linear-gradient(135deg,#5a1f1a 0%,#82302a 60%,#9c4330 100%)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI","PingFang TC",sans-serif;-webkit-font-smoothing:antialiased}

/* ---------- Hero ---------- */
.hero{background:
  radial-gradient(circle at 12% 20%,rgba(255,255,255,.10) 0 2px,transparent 3px) 0 0/26px 26px,
  var(--hero-bg);
  color:#fff;padding:22px 16px 20px}
.hero-in{max-width:920px;margin:auto}
.brand{display:flex;align-items:center;gap:14px}
.seal{flex:none;width:56px;height:56px;border-radius:14px;background:#fff;color:var(--pri-d);display:grid;place-items:center;font:700 32px/1 var(--hanzi);box-shadow:0 6px 16px -6px rgba(0,0,0,.4);transform:rotate(-4deg)}
.brand h1{margin:0;font:700 clamp(22px,4.6vw,32px)/1.15 var(--hanzi);letter-spacing:.5px}
.brand p{margin:2px 0 0;opacity:.88;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 14px}
.stat-card{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px;backdrop-filter:blur(4px)}
.stat-card b{display:block;font-size:clamp(20px,4vw,26px);line-height:1.1}
.stat-card span{font-size:12.5px;opacity:.9}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#ffd98a;border-radius:99px;transition:width .4s}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:13px}
.ctrl .sp{display:flex;align-items:center;gap:8px}
.ctrl select,.ctrl button{font:inherit;font-size:13px;border:0;border-radius:99px;padding:6px 12px;background:rgba(255,255,255,.95);color:#2a2622;cursor:pointer}
.ctrl select{max-width:190px}
.ctrl input[type=range]{width:90px;accent-color:#ffd98a}

/* ---------- Thanh chọn bài ---------- */
.lessonbar{max-width:920px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.lessonbar::-webkit-scrollbar{display:none}
.lchip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}
.lchip small{display:block;font:500 11px/1.2 var(--hanzi);color:var(--mut);max-width:120px;overflow:hidden;text-overflow:ellipsis}
.lchip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.lchip.on small{color:rgba(255,255,255,.85)}

/* ---------- Điều hướng ---------- */
nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;max-width:920px;margin:12px auto 0;padding:8px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;line-height:1.2;box-shadow:var(--shadow);transition:transform .12s,background .15s}
nav button:hover{transform:translateY(-1px)}
nav button.on{background:linear-gradient(180deg,var(--pri),var(--pri-d));border-color:var(--pri-d);color:#fff}
nav .ic{font-size:18px}
@media (max-width:720px){
  nav{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;max-width:none;padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));border-top:1px solid var(--line);background:var(--card);backdrop-filter:none;gap:2px}
  nav button{flex-direction:column;gap:1px;padding:6px 1px;font-size:10px;border:0;box-shadow:none;border-radius:10px;background:transparent}
  nav button.on{background:var(--pri2);color:var(--pri)}
  nav .ic{font-size:21px}
  body{padding-bottom:78px}
  .stats{gap:8px}
}

/* ---------- Nội dung ---------- */
main{max-width:920px;margin:auto;padding:14px 16px 28px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:0 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h3{margin:0 0 8px;font-size:18px}
.zh{font:600 28px/1.35 var(--hanzi)}
.py{color:var(--pri);font-size:16px}
.vi{color:var(--mut)}
.stat{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lh{font-weight:700;margin:22px 0 10px;color:var(--ink);font-size:18px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lh::before{content:"";width:6px;height:20px;border-radius:3px;background:linear-gradient(var(--pri),var(--gold));align-self:center}
.lh .vi{font-weight:500;font-size:15px}

/* nút */
.b{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:99px;cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;line-height:1.2;transition:transform .1s,border-color .15s,box-shadow .15s}
.b:hover{border-color:var(--pri);transform:translateY(-1px)}
.b:active{transform:none}
.b.p{background:linear-gradient(180deg,var(--pri),var(--pri-d));color:#fff;border-color:var(--pri-d);box-shadow:0 6px 14px -8px var(--pri-d)}
.b.spk{width:36px;height:36px;padding:0;border-radius:50%;background:var(--acc2);border-color:transparent;font-size:15px}
.b.ok{background:var(--okbg);border-color:var(--ok)}
.b.bad{background:var(--badbg);border-color:var(--bad)}

#bbar{padding-bottom:2px}
#bbar .lchip{font-weight:700}
#bbar .lchip.on{background:linear-gradient(180deg,var(--pri),var(--pri-d));color:#fff;border-color:var(--pri-d)}
#bbar .lchip.on small{color:rgba(255,255,255,.85)}
.tf-intro{font-size:15px;line-height:1.6;margin-bottom:12px}
.tf-n{font-weight:500;opacity:.75;font-size:12px}
.tf-bar{align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.tf-bar select{flex:1;min-width:200px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.seg{display:flex;gap:4px;padding:4px;background:var(--acc2);border-radius:99px;margin-bottom:14px}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:9px 4px;border-radius:99px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:var(--shadow)}
.pos{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 5px;vertical-align:middle}
.lv{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;vertical-align:middle;background:var(--acc2);color:var(--acc)}
.lv-B1,.lv-B2{background:var(--pri2);color:var(--pri)}

/* chip */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);cursor:pointer;font-size:14px;color:var(--ink);transition:background .15s}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:700}

input[type=text],input[type=search],textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:17px;outline:none;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input[type=search]:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc2)}

/* từ vựng */
.vl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.vl:last-child{border:0}
.vl .zh{font-size:26px}

/* thẻ nhớ */
.flash{text-align:center;padding:36px 16px;cursor:pointer;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:8px;
  background:linear-gradient(160deg,var(--card),var(--pri2));border:2px solid var(--pri);border-radius:26px;box-shadow:0 18px 40px -22px var(--pri-d)}
.flash .zh{font-size:clamp(52px,14vw,84px)}

/* bài tập */
.opt{display:block;width:100%;text-align:left;margin:8px 0;border-radius:14px;padding:13px 16px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{padding:12px 14px;border-radius:14px;margin-top:12px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.tok{display:inline-block;padding:8px 14px;margin:4px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font:600 21px var(--hanzi);color:var(--ink);box-shadow:var(--shadow)}
.ans{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:6px;margin:10px 0}

/* ngữ pháp & ví dụ */
.ex{padding:10px 14px;border-left:4px solid var(--pri);margin:10px 0;background:var(--pri2);border-radius:0 14px 14px 0}
.ex .zh{font-size:21px}

/* hội thoại */
.bub{max-width:90%;padding:10px 14px;border-radius:18px;margin:10px 0;border:1px solid var(--line)}
.bub.l{background:var(--pri2);margin-right:auto;border-bottom-left-radius:4px}
.bub.r{background:var(--acc2);margin-left:auto;border-color:transparent;border-bottom-right-radius:4px}
.who{font-size:12px;font-weight:700;letter-spacing:.3px;margin-bottom:2px}
.bub.l .who{color:var(--pri)}.bub.r .who{color:var(--acc)}
.bub.r .py{color:var(--acc)}
.qq{padding:10px 0;border-top:1px dashed var(--line)}

/* pinyin phía trên chữ Hán (ruby) + bảng chú giải */
ruby{ruby-position:over}
rt{font:500 .5em/1 system-ui,sans-serif;color:var(--pri);letter-spacing:0}
.lh,.gh,.formula{line-height:2.1}
.formula{font-weight:600;color:var(--ink);font-size:18px;background:var(--pri2);border-radius:12px;padding:6px 12px;margin:4px 0 8px;display:block}
.gloss{display:flex;flex-wrap:wrap;gap:6px 8px;margin:4px 0 6px;font-size:14px}
.gloss span{background:var(--acc2);color:var(--ink);padding:3px 11px;border-radius:99px}
.gloss i{color:var(--pri);font-style:normal}
.gloss .zh{font-size:17px}
.tap{cursor:pointer;border-radius:6px;transition:background .15s}
.tap:hover{background:var(--acc2)}
/* truyện + chấm phát âm */
.sl{padding:12px 0;border-top:1px dashed var(--line)}
.tip{background:var(--acc2);border-color:transparent;font-size:15px}
.mic{padding:8px 16px}
.mic.rec{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.mic.rec{animation:pulse 1.1s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(192,57,43,.18)}}
.badge{font-weight:700;color:var(--ok)}
.rr{margin-top:10px;padding:12px 14px;border-radius:14px}
.rr.good{background:var(--okbg)}.rr.low{background:var(--badbg)}
.fix{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px dashed var(--bad)}
.fix.ok{border-color:var(--ok);border-style:solid}
.del{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.ins{color:var(--ok);font-weight:700;background:var(--okbg);border-radius:4px;padding:0 1px}
.qa-q{font:600 28px/1.4 var(--hanzi);margin:8px 0}
.scoregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;font-size:13px;color:var(--mut)}
.sc b{display:block;font-size:22px;color:var(--ink)}
.tips{margin:6px 0 8px;padding-left:20px}.tips li{margin:3px 0}
.qa-sample{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--card)}
.whole{margin-top:16px;padding:14px;border-radius:14px;background:var(--pri2)}
.whole-text{font-size:22px;line-height:1.8;margin:6px 0}
.big{font-size:20px;margin-bottom:4px}
.sres{padding:8px 0;border-top:1px dashed var(--line)}
.sres .row{gap:10px}.okc{color:var(--ok)}.badc{color:var(--bad)}
.words{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.w{display:inline-flex;flex-direction:column;align-items:center;padding:3px 10px;border-radius:10px;font:600 21px/1.3 var(--hanzi)}
.w small{font:500 11px system-ui,sans-serif;color:var(--mut)}
.w.ok{background:var(--okbg);outline:1px solid var(--ok)}
.w.bad{background:var(--badbg);outline:1px solid var(--bad)}
.w.name{background:var(--card);outline:1px dashed var(--line)}
/* ---------- phụ ---------- */
@media (max-width:480px){.zh{font-size:25px}.card{padding:14px;border-radius:16px}.bub{max-width:96%}.ctrl select{max-width:150px}}

/* ======== Làm mới giao diện (v2) ======== */
:root{
  --bg:#f3eee4;--card:#fffefb;--ink:#26211c;--mut:#7a6f63;--line:#e6dccb;
  --pri:#c23b2b;--pri-d:#9c2b1f;--pri2:#fbece6;
  --acc:#17695f;--acc2:#e3f0ec;--gold:#c8962e;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 1px 2px rgba(60,40,20,.06),0 14px 30px -18px rgba(60,40,20,.32);
  --hero-bg:linear-gradient(160deg,#1f1a17 0%,#2b2320 60%,#3a2a24 100%);
  --hanzi:"Noto Serif TC","Songti TC","PingFang TC","Hiragino Sans CNS",serif;
  --ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120f;--card:#211d1a;--line:#38312a;--pri:#ee6a56;--pri2:#33231f;--hero-bg:linear-gradient(160deg,#0e0c0a,#1c1613 70%,#2a1d18)}}
:root[data-theme="dark"]{--bg:#15120f;--card:#211d1a;--line:#38312a;--pri:#ee6a56;--pri2:#33231f;--hero-bg:linear-gradient(160deg,#0e0c0a,#1c1613 70%,#2a1d18)}
body{font-family:var(--ui);font-size:15.5px;line-height:1.6;
  background:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--pri) 9%,transparent),transparent 70%),var(--bg)}
.hero{position:relative;padding:26px 16px 22px;background:var(--hero-bg);border-bottom:3px solid var(--pri)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(circle at 92% 0,rgba(200,150,46,.28),transparent 45%)}
.hero-in{position:relative;z-index:1}
.seal{width:58px;height:58px;border-radius:12px;background:var(--pri);color:#fff;border:2px solid rgba(255,255,255,.85);
  box-shadow:0 0 0 3px var(--pri),0 10px 20px -8px rgba(0,0,0,.6);transform:rotate(-3deg);font-family:var(--hanzi);font-weight:900}
.brand h1{font-family:var(--hanzi);font-weight:900;letter-spacing:1px}
.brand p{color:#e9dccb;opacity:.9}
.stat-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px}
.stat-card b{font-family:var(--hanzi);color:#ffd98a}
.bar{background:rgba(255,255,255,.15)}.bar i{background:linear-gradient(90deg,#e0a93a,#ffd98a)}
.ctrl select,.ctrl button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22)}
.ctrl select option{color:#222}
.lessonbar{padding:2px 16px 6px;margin-top:16px}
.lchip{border-radius:14px;padding:7px 14px;box-shadow:none;font-family:var(--ui);font-weight:600;transition:all .15s}
.lchip:hover{border-color:var(--pri);transform:translateY(-1px)}
.lchip.on{background:var(--pri);box-shadow:0 8px 16px -10px var(--pri-d)}
#bbar{margin-top:18px}
#bbar .lchip{border-radius:99px;padding:7px 16px}
#bbar .lchip small{font-family:var(--ui);font-weight:500}
nav button{border-radius:99px;box-shadow:none;font-family:var(--ui);font-size:14.5px}
nav button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@media (max-width:720px){nav button.on{background:var(--pri2);color:var(--pri);border:0}}
.card{border-radius:22px;padding:20px;border-color:color-mix(in srgb,var(--line) 70%,transparent)}
h3{font-family:var(--hanzi);font-weight:700}
.zh,.qa-q,.w,.tok{font-family:var(--hanzi)}
.zh{font-weight:700}
.py{font-weight:500}
.lh{font-family:var(--hanzi);font-size:19px;margin-top:26px}
.lh::before{width:5px;height:22px}
.b{font-family:var(--ui);font-weight:600;padding:10px 18px;box-shadow:0 1px 2px rgba(60,40,20,.06)}
.b.p{background:var(--pri);border-color:var(--pri-d);box-shadow:0 10px 18px -10px var(--pri-d)}
.b.spk{background:var(--acc2);color:var(--acc);box-shadow:none}
.b.spk:hover{background:var(--acc);color:#fff}
.chip{font-family:var(--ui)}
.seg{background:color-mix(in srgb,var(--line) 55%,transparent);padding:5px}
.seg button{font-family:var(--ui);font-size:13.5px;padding:10px 4px}
.seg button.on{color:var(--pri);box-shadow:0 2px 8px -2px rgba(60,40,20,.25)}
.tf-intro{background:linear-gradient(120deg,var(--pri2),transparent 80%);border-left:4px solid var(--gold);border-radius:0 16px 16px 0}
.vl{border-radius:14px;padding:12px 10px;margin:0 -10px;transition:background .15s}
.vl:hover{background:color-mix(in srgb,var(--acc2) 55%,transparent)}
.vl .zh{font-size:28px}
.flash{border-radius:28px;border:1.5px solid var(--pri);background:radial-gradient(circle at 50% 0,var(--pri2),var(--card) 70%);box-shadow:0 24px 50px -28px var(--pri-d)}
.flash .zh{font-weight:900}
.ex{border-left-color:var(--gold);background:linear-gradient(90deg,var(--pri2),transparent)}
.bub{border-radius:20px;box-shadow:var(--shadow)}
input[type=text],input[type=search],textarea,.tf-bar select{font-family:var(--ui);border-radius:16px}
footer{padding:8px 16px 28px}

body{background:var(--bg);font-family:var(--ui);letter-spacing:-.005em}

/* ======== v4: layout kiểu hihsk (thanh trên + trang chủ) ======== */
.site{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.site-in{max-width:1120px;margin:auto;padding:0 16px}
.site-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 6px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .lg{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font:700 22px/1 var(--hanzi);box-shadow:0 6px 16px -6px rgba(66,153,225,.7)}

.subnav .lchip.on{background:var(--pri2);color:var(--pri);border-color:transparent;box-shadow:none}
#bbar{margin-top:0}
#bbar .lchip{border-radius:10px;padding:6px 12px}
#bbar .lchip.on{background:var(--pri2);color:var(--pri);box-shadow:none}
main.home{max-width:1120px;padding-top:0}

.cta-band h2{font:800 clamp(24px,4vw,34px)/1.2 var(--ui);margin:12px 0 8px;letter-spacing:-.03em}
.cta-band p{color:#cbd5e1;margin:0 0 22px}
.cta-band .cta{justify-content:center}
.cta-band .btn-l:not(.p){background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.25)}
