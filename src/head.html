<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Học Tiếng Trung 當代中文課程 1</title>
<style>
:root{
  --bg:#f6f1e8;--card:#fffdf9;--ink:#2a2622;--mut:#7c7267;--line:#eadfce;
  --pri:#b8372b;--pri-d:#8f2a22;--pri2:#fbe9e4;
  --acc:#1f7a74;--acc2:#e1f1ee;--gold:#c9972b;
  --ok:#2e8b57;--okbg:#e4f5ea;--bad:#c0392b;--badbg:#fdeae6;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 10px 28px -14px rgba(60,40,20,.28);
  --hero-bg:linear-gradient(135deg,#8f2a22 0%,#b8372b 55%,#d1593b 100%);
  --hanzi:"Songti TC","Noto Serif TC","PingFang TC","Hiragino Sans CNS",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#242120;--ink:#f2ede5;--mut:#a59c90;--line:#37322d;
  --pri:#f0705f;--pri-d:#c9483a;--pri2:#3a2824;
  --acc:#5cc6bc;--acc2:#1c3633;--gold:#e0b04a;
  --ok:#5cc88a;--okbg:#1e3427;--bad:#f0705f;--badbg:#3a2623;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark;--hero-bg:linear-gradient(135deg,#5a1f1a 0%,#82302a 60%,#9c4330 100%)}}
:root[data-theme="dark"]{--bg:#171513;--card:#242120;--ink:#f2ede5;--mut:#a59c90;--line:#37322d;
  --pri:#f0705f;--pri-d:#c9483a;--pri2:#3a2824;
  --acc:#5cc6bc;--acc2:#1c3633;--gold:#e0b04a;
  --ok:#5cc88a;--okbg:#1e3427;--bad:#f0705f;--badbg:#3a2623;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark;--hero-bg:linear-gradient(135deg,#5a1f1a 0%,#82302a 60%,#9c4330 100%)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI","PingFang TC",sans-serif;-webkit-font-smoothing:antialiased}

/* ---------- Hero ---------- */
.hero{background:
  radial-gradient(circle at 12% 20%,rgba(255,255,255,.10) 0 2px,transparent 3px) 0 0/26px 26px,
  var(--hero-bg);
  color:#fff;padding:22px 16px 20px}
.hero-in{max-width:920px;margin:auto}
.brand{display:flex;align-items:center;gap:14px}
.seal{flex:none;width:56px;height:56px;border-radius:14px;background:#fff;color:var(--pri-d);display:grid;place-items:center;font:700 32px/1 var(--hanzi);box-shadow:0 6px 16px -6px rgba(0,0,0,.4);transform:rotate(-4deg)}
.brand h1{margin:0;font:700 clamp(22px,4.6vw,32px)/1.15 var(--hanzi);letter-spacing:.5px}
.brand p{margin:2px 0 0;opacity:.88;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 14px}
.stat-card{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px;backdrop-filter:blur(4px)}
.stat-card b{display:block;font-size:clamp(20px,4vw,26px);line-height:1.1}
.stat-card span{font-size:12.5px;opacity:.9}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#ffd98a;border-radius:99px;transition:width .4s}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:13px}
.ctrl .sp{display:flex;align-items:center;gap:8px}
.ctrl select,.ctrl button{font:inherit;font-size:13px;border:0;border-radius:99px;padding:6px 12px;background:rgba(255,255,255,.95);color:#2a2622;cursor:pointer}
.ctrl select{max-width:190px}
.ctrl input[type=range]{width:90px;accent-color:#ffd98a}

/* ---------- Thanh chọn bài ---------- */
.lessonbar{max-width:920px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.lessonbar::-webkit-scrollbar{display:none}
.lchip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}
.lchip small{display:block;font:500 11px/1.2 var(--hanzi);color:var(--mut);max-width:120px;overflow:hidden;text-overflow:ellipsis}
.lchip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.lchip.on small{color:rgba(255,255,255,.85)}

/* ---------- Điều hướng ---------- */
nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;max-width:920px;margin:12px auto 0;padding:8px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;line-height:1.2;box-shadow:var(--shadow);transition:transform .12s,background .15s}
nav button:hover{transform:translateY(-1px)}
nav button.on{background:linear-gradient(180deg,var(--pri),var(--pri-d));border-color:var(--pri-d);color:#fff}
nav .ic{font-size:18px}
@media (max-width:720px){
  nav{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;max-width:none;padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));border-top:1px solid var(--line);background:var(--card);backdrop-filter:none;gap:2px}
  nav button{flex-direction:column;gap:1px;padding:6px 2px;font-size:11px;border:0;box-shadow:none;border-radius:10px;background:transparent}
  nav button.on{background:var(--pri2);color:var(--pri)}
  nav .ic{font-size:21px}
  body{padding-bottom:78px}
  .stats{gap:8px}
}

/* ---------- Nội dung ---------- */
main{max-width:920px;margin:auto;padding:14px 16px 28px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:0 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h3{margin:0 0 8px;font-size:18px}
.zh{font:600 28px/1.35 var(--hanzi)}
.py{color:var(--pri);font-size:16px}
.vi{color:var(--mut)}
.stat{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lh{font-weight:700;margin:22px 0 10px;color:var(--ink);font-size:18px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lh::before{content:"";width:6px;height:20px;border-radius:3px;background:linear-gradient(var(--pri),var(--gold));align-self:center}
.lh .vi{font-weight:500;font-size:15px}

/* nút */
.b{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:99px;cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;line-height:1.2;transition:transform .1s,border-color .15s,box-shadow .15s}
.b:hover{border-color:var(--pri);transform:translateY(-1px)}
.b:active{transform:none}
.b.p{background:linear-gradient(180deg,var(--pri),var(--pri-d));color:#fff;border-color:var(--pri-d);box-shadow:0 6px 14px -8px var(--pri-d)}
.b.spk{width:36px;height:36px;padding:0;border-radius:50%;background:var(--acc2);border-color:transparent;font-size:15px}
.b.ok{background:var(--okbg);border-color:var(--ok)}
.b.bad{background:var(--badbg);border-color:var(--bad)}

/* chip */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);cursor:pointer;font-size:14px;color:var(--ink);transition:background .15s}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:700}

input[type=text],input[type=search],textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:17px;outline:none;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input[type=search]:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc2)}

/* từ vựng */
.vl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.vl:last-child{border:0}
.vl .zh{font-size:26px}

/* thẻ nhớ */
.flash{text-align:center;padding:36px 16px;cursor:pointer;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:8px;
  background:linear-gradient(160deg,var(--card),var(--pri2));border:2px solid var(--pri);border-radius:26px;box-shadow:0 18px 40px -22px var(--pri-d)}
.flash .zh{font-size:clamp(52px,14vw,84px)}

/* bài tập */
.opt{display:block;width:100%;text-align:left;margin:8px 0;border-radius:14px;padding:13px 16px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{padding:12px 14px;border-radius:14px;margin-top:12px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.tok{display:inline-block;padding:8px 14px;margin:4px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font:600 21px var(--hanzi);color:var(--ink);box-shadow:var(--shadow)}
.ans{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:6px;margin:10px 0}

/* ngữ pháp & ví dụ */
.ex{padding:10px 14px;border-left:4px solid var(--pri);margin:10px 0;background:var(--pri2);border-radius:0 14px 14px 0}
.ex .zh{font-size:21px}

/* hội thoại */
.bub{max-width:90%;padding:10px 14px;border-radius:18px;margin:10px 0;border:1px solid var(--line)}
.bub.l{background:var(--pri2);margin-right:auto;border-bottom-left-radius:4px}
.bub.r{background:var(--acc2);margin-left:auto;border-color:transparent;border-bottom-right-radius:4px}
.who{font-size:12px;font-weight:700;letter-spacing:.3px;margin-bottom:2px}
.bub.l .who{color:var(--pri)}.bub.r .who{color:var(--acc)}
.bub.r .py{color:var(--acc)}
.qq{padding:10px 0;border-top:1px dashed var(--line)}

/* pinyin phía trên chữ Hán (ruby) + bảng chú giải */
ruby{ruby-position:over}
rt{font:500 .5em/1 system-ui,sans-serif;color:var(--pri);letter-spacing:0}
.lh,.gh,.formula{line-height:2.1}
.formula{font-weight:600;color:var(--ink);font-size:18px;background:var(--pri2);border-radius:12px;padding:6px 12px;margin:4px 0 8px;display:block}
.gloss{display:flex;flex-wrap:wrap;gap:6px 8px;margin:4px 0 6px;font-size:14px}
.gloss span{background:var(--acc2);color:var(--ink);padding:3px 11px;border-radius:99px}
.gloss i{color:var(--pri);font-style:normal}
.gloss .zh{font-size:17px}
/* ---------- phụ ---------- */
@media (max-width:480px){.zh{font-size:25px}.card{padding:14px;border-radius:16px}.bub{max-width:96%}.ctrl select{max-width:150px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div class="brand"><div class="seal">學</div>
    <div><h1>當代中文課程 1</h1><p>Học tiếng Trung · 15 bài · từ vựng, ngữ pháp, hội thoại, tập dịch</p></div></div>
  <div class="stats">
    <div class="stat-card"><b id="stK">0</b><span>từ đã thuộc</span><div class="bar"><i id="stKbar" style="width:0"></i></div></div>
    <div class="stat-card"><b id="stS">–</b><span>trả lời đúng</span><div class="bar"><i id="stSbar" style="width:0"></i></div></div>
    <div class="stat-card"><b id="stV">0</b><span>từ · 15 bài</span></div>
  </div>
  <div class="ctrl">
    <div class="sp"><span>Phạm vi</span><select id="les"></select></div>
    <div class="sp"><span>Tốc độ</span><input type="range" id="rate" min="0.4" max="1.2" step="0.1" value="0.8"></div>
    <div class="sp"><span>Giọng</span><b>Meijia · zh-TW</b><button id="voiceTest">🔊 Nghe thử</button></div>
  </div>
</div></header>
<div class="lessonbar" id="lbar"></div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>加油！Mỗi ngày một chút, chữ Hán sẽ quen dần. 💪</footer>
