<title>Học Tiếng Trung 當代中文課程 1</title>
<style>
:root{
  --bg:#f6f1e8;--card:#fffdf9;--ink:#2a2622;--mut:#7c7267;--line:#eadfce;
  --pri:#b8372b;--pri-d:#8f2a22;--pri2:#fbe9e4;
  --acc:#1f7a74;--acc2:#e1f1ee;--gold:#c9972b;
  --ok:#2e8b57;--okbg:#e4f5ea;--bad:#c0392b;--badbg:#fdeae6;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 10px 28px -14px rgba(60,40,20,.28);
  --hero-bg:linear-gradient(135deg,#8f2a22 0%,#b8372b 55%,#d1593b 100%);
  --hanzi:"Songti TC","Noto Serif TC","PingFang TC","Hiragino Sans CNS",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#242120;--ink:#f2ede5;--mut:#a59c90;--line:#37322d;
  --pri:#f0705f;--pri-d:#c9483a;--pri2:#3a2824;
  --acc:#5cc6bc;--acc2:#1c3633;--gold:#e0b04a;
  --ok:#5cc88a;--okbg:#1e3427;--bad:#f0705f;--badbg:#3a2623;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark;--hero-bg:linear-gradient(135deg,#5a1f1a 0%,#82302a 60%,#9c4330 100%)}}
:root[data-theme="dark"]{--bg:#171513;--card:#242120;--ink:#f2ede5;--mut:#a59c90;--line:#37322d;
  --pri:#f0705f;--pri-d:#c9483a;--pri2:#3a2824;
  --acc:#5cc6bc;--acc2:#1c3633;--gold:#e0b04a;
  --ok:#5cc88a;--okbg:#1e3427;--bad:#f0705f;--badbg:#3a2623;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark;--hero-bg:linear-gradient(135deg,#5a1f1a 0%,#82302a 60%,#9c4330 100%)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI","PingFang TC",sans-serif;-webkit-font-smoothing:antialiased}

/* ---------- Hero ---------- */
.hero{background:
  radial-gradient(circle at 12% 20%,rgba(255,255,255,.10) 0 2px,transparent 3px) 0 0/26px 26px,
  var(--hero-bg);
  color:#fff;padding:22px 16px 20px}
.hero-in{max-width:920px;margin:auto}
.brand{display:flex;align-items:center;gap:14px}
.seal{flex:none;width:56px;height:56px;border-radius:14px;background:#fff;color:var(--pri-d);display:grid;place-items:center;font:700 32px/1 var(--hanzi);box-shadow:0 6px 16px -6px rgba(0,0,0,.4);transform:rotate(-4deg)}
.brand h1{margin:0;font:700 clamp(22px,4.6vw,32px)/1.15 var(--hanzi);letter-spacing:.5px}
.brand p{margin:2px 0 0;opacity:.88;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 14px}
.stat-card{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px;backdrop-filter:blur(4px)}
.stat-card b{display:block;font-size:clamp(20px,4vw,26px);line-height:1.1}
.stat-card span{font-size:12.5px;opacity:.9}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#ffd98a;border-radius:99px;transition:width .4s}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:13px}
.ctrl .sp{display:flex;align-items:center;gap:8px}
.ctrl select,.ctrl button{font:inherit;font-size:13px;border:0;border-radius:99px;padding:6px 12px;background:rgba(255,255,255,.95);color:#2a2622;cursor:pointer}
.ctrl select{max-width:190px}
.ctrl input[type=range]{width:90px;accent-color:#ffd98a}

/* ---------- Thanh chọn bài ---------- */
.lessonbar{max-width:920px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.lessonbar::-webkit-scrollbar{display:none}
.lchip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}
.lchip small{display:block;font:500 11px/1.2 var(--hanzi);color:var(--mut);max-width:120px;overflow:hidden;text-overflow:ellipsis}
.lchip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.lchip.on small{color:rgba(255,255,255,.85)}

/* ---------- Điều hướng ---------- */
nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;max-width:920px;margin:12px auto 0;padding:8px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;line-height:1.2;box-shadow:var(--shadow);transition:transform .12s,background .15s}
nav button:hover{transform:translateY(-1px)}
nav button.on{background:linear-gradient(180deg,var(--pri),var(--pri-d));border-color:var(--pri-d);color:#fff}
nav .ic{font-size:18px}
@media (max-width:720px){
  nav{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;max-width:none;padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));border-top:1px solid var(--line);background:var(--card);backdrop-filter:none;gap:2px}
  nav button{flex-direction:column;gap:1px;padding:6px 1px;font-size:10px;border:0;box-shadow:none;border-radius:10px;background:transparent}
  nav button.on{background:var(--pri2);color:var(--pri)}
  nav .ic{font-size:21px}
  body{padding-bottom:78px}
  .stats{gap:8px}
}

/* ---------- Nội dung ---------- */
main{max-width:920px;margin:auto;padding:14px 16px 28px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:0 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h3{margin:0 0 8px;font-size:18px}
.zh{font:600 28px/1.35 var(--hanzi)}
.py{color:var(--pri);font-size:16px}
.vi{color:var(--mut)}
.stat{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lh{font-weight:700;margin:22px 0 10px;color:var(--ink);font-size:18px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lh::before{content:"";width:6px;height:20px;border-radius:3px;background:linear-gradient(var(--pri),var(--gold));align-self:center}
.lh .vi{font-weight:500;font-size:15px}

/* nút */
.b{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:99px;cursor:pointer;font-family:inherit;font-weight:600;font-size:15px;line-height:1.2;transition:transform .1s,border-color .15s,box-shadow .15s}
.b:hover{border-color:var(--pri);transform:translateY(-1px)}
.b:active{transform:none}
.b.p{background:linear-gradient(180deg,var(--pri),var(--pri-d));color:#fff;border-color:var(--pri-d);box-shadow:0 6px 14px -8px var(--pri-d)}
.b.spk{width:36px;height:36px;padding:0;border-radius:50%;background:var(--acc2);border-color:transparent;font-size:15px}
.b.ok{background:var(--okbg);border-color:var(--ok)}
.b.bad{background:var(--badbg);border-color:var(--bad)}

/* chip */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);cursor:pointer;font-size:14px;color:var(--ink);transition:background .15s}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:700}

input[type=text],input[type=search],textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:17px;outline:none;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input[type=search]:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc2)}

/* từ vựng */
.vl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.vl:last-child{border:0}
.vl .zh{font-size:26px}

/* thẻ nhớ */
.flash{text-align:center;padding:36px 16px;cursor:pointer;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:8px;
  background:linear-gradient(160deg,var(--card),var(--pri2));border:2px solid var(--pri);border-radius:26px;box-shadow:0 18px 40px -22px var(--pri-d)}
.flash .zh{font-size:clamp(52px,14vw,84px)}

/* bài tập */
.opt{display:block;width:100%;text-align:left;margin:8px 0;border-radius:14px;padding:13px 16px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{padding:12px 14px;border-radius:14px;margin-top:12px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.tok{display:inline-block;padding:8px 14px;margin:4px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font:600 21px var(--hanzi);color:var(--ink);box-shadow:var(--shadow)}
.ans{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:6px;margin:10px 0}

/* ngữ pháp & ví dụ */
.ex{padding:10px 14px;border-left:4px solid var(--pri);margin:10px 0;background:var(--pri2);border-radius:0 14px 14px 0}
.ex .zh{font-size:21px}

/* hội thoại */
.bub{max-width:90%;padding:10px 14px;border-radius:18px;margin:10px 0;border:1px solid var(--line)}
.bub.l{background:var(--pri2);margin-right:auto;border-bottom-left-radius:4px}
.bub.r{background:var(--acc2);margin-left:auto;border-color:transparent;border-bottom-right-radius:4px}
.who{font-size:12px;font-weight:700;letter-spacing:.3px;margin-bottom:2px}
.bub.l .who{color:var(--pri)}.bub.r .who{color:var(--acc)}
.bub.r .py{color:var(--acc)}
.qq{padding:10px 0;border-top:1px dashed var(--line)}

/* pinyin phía trên chữ Hán (ruby) + bảng chú giải */
ruby{ruby-position:over}
rt{font:500 .5em/1 system-ui,sans-serif;color:var(--pri);letter-spacing:0}
.lh,.gh,.formula{line-height:2.1}
.formula{font-weight:600;color:var(--ink);font-size:18px;background:var(--pri2);border-radius:12px;padding:6px 12px;margin:4px 0 8px;display:block}
.gloss{display:flex;flex-wrap:wrap;gap:6px 8px;margin:4px 0 6px;font-size:14px}
.gloss span{background:var(--acc2);color:var(--ink);padding:3px 11px;border-radius:99px}
.gloss i{color:var(--pri);font-style:normal}
.gloss .zh{font-size:17px}
.tap{cursor:pointer;border-radius:6px;transition:background .15s}
.tap:hover{background:var(--acc2)}
/* truyện + chấm phát âm */
.sl{padding:12px 0;border-top:1px dashed var(--line)}
.tip{background:var(--acc2);border-color:transparent;font-size:15px}
.mic{padding:8px 16px}
.mic.rec{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.mic.rec{animation:pulse 1.1s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(192,57,43,.18)}}
.badge{font-weight:700;color:var(--ok)}
.rr{margin-top:10px;padding:12px 14px;border-radius:14px}
.rr.good{background:var(--okbg)}.rr.low{background:var(--badbg)}
.fix{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px dashed var(--bad)}
.fix.ok{border-color:var(--ok);border-style:solid}
.del{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.ins{color:var(--ok);font-weight:700;background:var(--okbg);border-radius:4px;padding:0 1px}
.qa-q{font:600 28px/1.4 var(--hanzi);margin:8px 0}
.scoregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;font-size:13px;color:var(--mut)}
.sc b{display:block;font-size:22px;color:var(--ink)}
.tips{margin:6px 0 8px;padding-left:20px}.tips li{margin:3px 0}
.qa-sample{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--card)}
.whole{margin-top:16px;padding:14px;border-radius:14px;background:var(--pri2)}
.whole-text{font-size:22px;line-height:1.8;margin:6px 0}
.big{font-size:20px;margin-bottom:4px}
.sres{padding:8px 0;border-top:1px dashed var(--line)}
.sres .row{gap:10px}.okc{color:var(--ok)}.badc{color:var(--bad)}
.words{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.w{display:inline-flex;flex-direction:column;align-items:center;padding:3px 10px;border-radius:10px;font:600 21px/1.3 var(--hanzi)}
.w small{font:500 11px system-ui,sans-serif;color:var(--mut)}
.w.ok{background:var(--okbg);outline:1px solid var(--ok)}
.w.bad{background:var(--badbg);outline:1px solid var(--bad)}
.w.name{background:var(--card);outline:1px dashed var(--line)}
/* ---------- phụ ---------- */
@media (max-width:480px){.zh{font-size:25px}.card{padding:14px;border-radius:16px}.bub{max-width:96%}.ctrl select{max-width:150px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div class="brand"><div class="seal">學</div>
    <div><h1>當代中文課程 1</h1><p>Học tiếng Trung · 15 bài · từ vựng, ngữ pháp, hội thoại, tập dịch</p></div></div>
  <div class="stats">
    <div class="stat-card"><b id="stK">0</b><span>từ đã thuộc</span><div class="bar"><i id="stKbar" style="width:0"></i></div></div>
    <div class="stat-card"><b id="stS">–</b><span>trả lời đúng</span><div class="bar"><i id="stSbar" style="width:0"></i></div></div>
    <div class="stat-card"><b id="stV">0</b><span>từ · 15 bài</span></div>
  </div>
  <div class="ctrl">
    <div class="sp"><span>Phạm vi</span><select id="les"></select></div>
    <div class="sp"><span>Tốc độ</span><input type="range" id="rate" min="0.4" max="1.2" step="0.1" value="0.8"></div>
    <div class="sp"><span>Giọng</span><b>Meijia · zh-TW</b><button id="voiceTest">🔊 Nghe thử</button></div>
  </div>
</div></header>
<div class="lessonbar" id="lbar"></div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>加油！Mỗi ngày một chút, chữ Hán sẽ quen dần. 💪</footer>
<script>
/* ============ DỮ LIỆU 15 BÀI — 當代中文課程 1 ============
 v: từ vựng  "Hán|pinyin|nghĩa"
 g: ngữ pháp [tiêu đề, công thức, giải thích, ví dụ "Hán|pinyin|nghĩa"]
 s: câu dịch / đoạn văn "tiếng Việt|Hán|pinyin"
 o: sắp xếp câu "tiếng Việt|từ từ từ"
*/
const LESSONS=[
{n:1,zh:"歡迎你來臺灣！",vi:"Chào mừng bạn đến Đài Loan",
v:`歡迎|huānyíng|chào mừng
來|lái|đến
臺灣|Táiwān|Đài Loan
你|nǐ|bạn
你好|nǐ hǎo|xin chào
您|nín|ngài (kính trọng)
您好|nín hǎo|chào ngài
我|wǒ|tôi
他|tā|anh ấy
她|tā|cô ấy
你們|nǐmen|các bạn
我們|wǒmen|chúng tôi
他們|tāmen|họ
朋友|péngyou|bạn bè
同學|tóngxué|bạn học
請|qǐng|xin mời, làm ơn
請進|qǐng jìn|mời vào
請問|qǐngwèn|xin hỏi
謝謝|xièxie|cảm ơn
不客氣|bú kèqi|không có gì
客氣|kèqi|khách sáo
再見|zàijiàn|tạm biệt
是|shì|là
不|bù|không
不是|bú shì|không phải
嗎|ma|(trợ từ nghi vấn)
呢|ne|còn… thì sao?
也|yě|cũng
很|hěn|rất
姓|xìng|họ
叫|jiào|tên là, gọi
什麼|shénme|cái gì
先生|xiānsheng|ông, ngài
小姐|xiǎojiě|cô
哪|nǎ|nào
國|guó|nước
人|rén|người
哪國人|nǎ guó rén|người nước nào
美國|Měiguó|Mỹ
日本|Rìběn|Nhật Bản
越南|Yuènán|Việt Nam
中國|Zhōngguó|Trung Quốc
這|zhè|đây, này
喝|hē|uống
茶|chá|trà
烏龍茶|wūlóngchá|trà ô long
咖啡|kāfēi|cà phê
好喝|hǎohē|ngon (đồ uống)
喜歡|xǐhuān|thích
要|yào|muốn, cần
接|jiē|đón`,
g:[
["是 (shì) và 不是 — “A là B”","A + 是 + B   |   A + 不是 + B","Nối hai danh từ. Phủ định dùng 不; 不 đọc thành bú trước âm thanh 4 (不是 = bú shì).",`我是美國人。|Wǒ shì Měiguó rén.|Tôi là người Mỹ.
他不是日本人。|Tā bú shì Rìběn rén.|Anh ấy không phải người Nhật.
這是王先生。|Zhè shì Wáng xiānsheng.|Đây là ông Vương.`],
["Câu hỏi 嗎 và 呢","Câu trần thuật + 嗎？   |   A，B呢？","嗎 biến câu thành câu hỏi có/không. 呢 dùng để hỏi lại: “còn… thì sao?”.",`你是臺灣人嗎？|Nǐ shì Táiwān rén ma?|Bạn là người Đài Loan à?
我喝茶，你呢？|Wǒ hē chá, nǐ ne?|Tôi uống trà, còn bạn?
我們喜歡喝咖啡，你們呢？|Wǒmen xǐhuān hē kāfēi, nǐmen ne?|Chúng tôi thích uống cà phê, còn các bạn?`],
["Câu hỏi chính-phản (A-not-A)","V + 不 + V？   |   是不是 / 喝不喝 / 要不要","Lặp động từ với 不 ở giữa để hỏi có/không, thay cho 嗎. Trả lời bằng động từ hoặc 不 + động từ.",`你是不是臺灣人？|Nǐ shì bu shì Táiwān rén?|Bạn có phải người Đài Loan không?
你喝不喝茶？|Nǐ hē bu hē chá?|Bạn có uống trà không?
你要不要喝咖啡？|Nǐ yào bu yào hē kāfēi?|Bạn có muốn uống cà phê không?`],
["Từ để hỏi: 什麼, 哪國人","Vị trí từ để hỏi = vị trí của câu trả lời","Không đảo từ để hỏi lên đầu câu và không dùng thêm 嗎.",`他姓什麼？|Tā xìng shénme?|Anh ấy họ gì?
你是哪國人？|Nǐ shì nǎ guó rén?|Bạn là người nước nào?
這是什麼？|Zhè shì shénme?|Đây là cái gì?`],
["很 + tính từ / 喜歡","S + 很 + Adj   |   S + 很 + 喜歡 + …","Tính từ làm vị ngữ thường cần 很 phía trước (nghĩa “rất” khá nhẹ).",`烏龍茶很好喝。|Wūlóngchá hěn hǎohē.|Trà ô long rất ngon.
我很喜歡喝咖啡。|Wǒ hěn xǐhuān hē kāfēi.|Tôi rất thích uống cà phê.
我們很喜歡臺灣。|Wǒmen hěn xǐhuān Táiwān.|Chúng tôi rất thích Đài Loan.`]
],
s:`Chào mừng bạn đến Đài Loan!|歡迎你來臺灣！|Huānyíng nǐ lái Táiwān!
Cảm ơn bạn đến đón chúng tôi.|謝謝你來接我們。|Xièxie nǐ lái jiē wǒmen.
Không có gì.|不客氣。|Bú kèqi.
Xin mời uống trà.|請喝茶。|Qǐng hē chá.
Bạn có uống trà không?|你要不要喝茶？|Nǐ yào bu yào hē chá?
Không, cảm ơn.|不要，謝謝。|Bú yào, xièxie.
Xin hỏi, bạn có phải người Nhật không?|請問你是不是日本人？|Qǐngwèn nǐ shì bu shì Rìběn rén?
Tôi không phải, còn bạn?|我不是，你呢？|Wǒ bú shì, nǐ ne?
Anh ấy họ gì?|他姓什麼？|Tā xìng shénme?
Anh ấy họ Lý.|他姓李。|Tā xìng Lǐ.
Cô ấy họ Vương, tên là Mỹ Nguyệt.|她姓王，叫美月。|Tā xìng Wáng, jiào Měiyuè.
Đây là ông Trần.|這是陳先生。|Zhè shì Chén xiānsheng.
Ông Trần là người Mỹ à?|陳先生是美國人嗎？|Chén xiānsheng shì Měiguó rén ma?
Trà ô long rất ngon.|烏龍茶很好喝。|Wūlóngchá hěn hǎohē.
Tôi rất thích uống cà phê.|我很喜歡喝咖啡。|Wǒ hěn xǐhuān hē kāfēi.
Chúng tôi thích uống cà phê, còn các bạn?|我們喜歡喝咖啡，你們呢？|Wǒmen xǐhuān hē kāfēi, nǐmen ne?
Tôi họ Lâm, tên là Tiểu Mỹ. Tôi là người Nhật. Tôi rất thích uống trà. Anh ấy họ Trần, tên là Đại Minh. Anh ấy là người Đài Loan, anh ấy thích uống cà phê. Chúng tôi đều thích Đài Loan.|我姓林，叫小美。我是日本人。我很喜歡喝茶。他姓陳，叫大明。他是臺灣人，他喜歡喝咖啡。我們都喜歡臺灣。|Wǒ xìng Lín, jiào Xiǎo Měi. Wǒ shì Rìběn rén. Wǒ hěn xǐhuān hē chá. Tā xìng Chén, jiào Dà Míng. Tā shì Táiwān rén, tā xǐhuān hē kāfēi. Wǒmen dōu xǐhuān Táiwān.`,
o:`Tôi là người Mỹ.|我 是 美國 人
Trà ô long rất ngon.|烏龍茶 很 好喝
Bạn có uống trà không?|你 要 不 要 喝 茶`},

g:[
["有 (yǒu) và 沒有 — có / không có","A + 有 + B   |   A + 沒有 + B","Phủ định của 有 là 沒有, KHÔNG dùng 不有.",`我有兩個哥哥。|Wǒ yǒu liǎng ge gēge.|Tôi có hai anh trai.
我家沒有茶。|Wǒ jiā méiyǒu chá.|Nhà tôi không có trà.
你有沒有兄弟姐妹？|Nǐ yǒu méi yǒu xiōngdì jiěmèi?|Bạn có anh chị em không?`],
["Lượng từ 個, 張 và số 兩","Số + lượng từ + danh từ   (2 → 兩 trước lượng từ)","Đếm người/vật bắt buộc có lượng từ. 個 dùng cho người và nhiều vật; 張 dùng cho vật dẹt như ảnh, giấy.",`兩個姐姐|liǎng ge jiějie|hai chị gái
三張照片|sān zhāng zhàopiàn|ba tấm ảnh
六個人|liù ge rén|sáu người`],
["的 (de) — sở hữu","N1 + 的 + N2","的 nối người sở hữu với vật. Khi quan hệ thân thiết (gia đình) thường bỏ 的: 我媽媽.",`這是我的房子。|Zhè shì wǒ de fángzi.|Đây là nhà của tôi.
王老師的家很漂亮。|Wáng lǎoshī de jiā hěn piàoliang.|Nhà của thầy Vương rất đẹp.
這是你家人的照片嗎？|Zhè shì nǐ jiārén de zhàopiàn ma?|Đây là ảnh người nhà bạn à?`],
["都 (dōu) — đều","S + 都 + V   (都 đứng sau chủ ngữ, trước động từ)","Dùng khi chủ ngữ số nhiều. 都不 = đều không.",`我們都是老師。|Wǒmen dōu shì lǎoshī.|Chúng tôi đều là giáo viên.
他們都喜歡看書。|Tāmen dōu xǐhuān kàn shū.|Họ đều thích đọc sách.
我家人都不喜歡照相。|Wǒ jiārén dōu bù xǐhuān zhào xiàng.|Người nhà tôi đều không thích chụp ảnh.`],
["幾 (jǐ) — hỏi số lượng nhỏ","幾 + lượng từ + danh từ？","Dùng khi đoán số lượng không lớn (dưới 10).",`你家有幾個人？|Nǐ jiā yǒu jǐ ge rén?|Nhà bạn có mấy người?
你有幾張照片？|Nǐ yǒu jǐ zhāng zhàopiàn?|Bạn có mấy tấm ảnh?
你有幾個姐姐？|Nǐ yǒu jǐ ge jiějie?|Bạn có mấy chị gái?`]
],
s:`Nhà bạn có mấy người?|你家有幾個人？|Nǐ jiā yǒu jǐ ge rén?
Nhà tôi có sáu người.|我家有六個人。|Wǒ jiā yǒu liù ge rén.
Bạn có anh chị em không?|你有沒有兄弟姐妹？|Nǐ yǒu méi yǒu xiōngdì jiěmèi?
Tôi không có anh chị em.|我沒有兄弟姐妹。|Wǒ méiyǒu xiōngdì jiěmèi.
Anh ấy có hai người anh trai.|他有兩個哥哥。|Tā yǒu liǎng ge gēge.
Đây là ảnh người nhà bạn à?|這是你家人的照片嗎？|Zhè shì nǐ jiārén de zhàopiàn ma?
Đúng vậy, họ đều rất xinh đẹp.|是的，他們都很漂亮。|Shì de, tāmen dōu hěn piàoliang.
Ngôi nhà này rất đẹp.|這個房子很漂亮。|Zhège fángzi hěn piàoliang.
Đây có phải sách của bạn không?|這是不是你的書？|Zhè shì bu shì nǐ de shū?
Nhà tôi không có trà.|我家沒有茶。|Wǒ jiā méiyǒu chá.
Người nhà bạn đều không thích đọc sách.|你家人都不喜歡看書。|Nǐ jiārén dōu bù xǐhuān kàn shū.
Bố mẹ tôi đều thích uống trà.|我爸爸媽媽都喜歡喝茶。|Wǒ bàba māma dōu xǐhuān hē chá.
Em gái tôi thích chụp ảnh.|我妹妹喜歡照相。|Wǒ mèimei xǐhuān zhào xiàng.
Chào bác gái, mời vào!|伯母您好，請進！|Bómǔ nín hǎo, qǐng jìn!
Chị gái tôi là giáo viên.|我姐姐是老師。|Wǒ jiějie shì lǎoshī.
Chào các bạn, tôi họ Trần. Nhà tôi có năm người: bố, mẹ, anh trai, em gái và tôi. Bố mẹ tôi đều thích uống trà và đọc sách. Em gái tôi thích chụp ảnh, nhà tôi có rất nhiều ảnh đẹp.|你們好，我姓陳。我家有五個人，爸爸、媽媽、哥哥、妹妹和我。我爸爸媽媽都喜歡喝茶、看書。我妹妹喜歡照相，我家有很多很漂亮的照片。|Nǐmen hǎo, wǒ xìng Chén. Wǒ jiā yǒu wǔ ge rén, bàba, māma, gēge, mèimei hé wǒ. Wǒ bàba māma dōu xǐhuān hē chá, kàn shū. Wǒ mèimei xǐhuān zhào xiàng, wǒ jiā yǒu hěn duō hěn piàoliang de zhàopiàn.`,
o:`Nhà tôi có sáu người.|我 家 有 六 個 人
Anh ấy có hai người anh trai.|他 有 兩 個 哥哥
Ngôi nhà của bạn rất đẹp.|你 的 房子 很 漂亮`},

{n:3,zh:"週末做什麼？",vi:"Cuối tuần làm gì?",

g:[
["想 / 要 + động từ — muốn làm gì","S + 想 + V   |   S + 要 + V","想 = muốn, định (nhẹ nhàng); 要 = muốn, cần (mạnh hơn). Phủ định: 不想, 不要.",`週末我想去游泳。|Zhōumò wǒ xiǎng qù yóuyǒng.|Cuối tuần tôi muốn đi bơi.
他想學中文。|Tā xiǎng xué Zhōngwén.|Anh ấy muốn học tiếng Trung.
我們想吃越南菜。|Wǒmen xiǎng chī Yuènán cài.|Chúng tôi muốn ăn món Việt.`],
["Động từ đi với môn thể thao: 打, 踢, 游","打 + bóng (tay/vợt)   |   踢 + bóng (chân)","Bóng rổ/bóng chày/quần vợt dùng 打; bóng đá dùng 踢; 游泳 tự nó là động từ.",`我常打籃球。|Wǒ cháng dǎ lánqiú.|Tôi thường chơi bóng rổ.
他常去打網球。|Tā cháng qù dǎ wǎngqiú.|Anh ấy thường đi đánh quần vợt.
她很喜歡踢足球。|Tā hěn xǐhuān tī zúqiú.|Cô ấy rất thích đá bóng.`],
["吧 (ba) — đề nghị, gợi ý","Câu + 吧！","Đặt cuối câu để rủ rê hoặc đề nghị: “… nhé / … đi”.",`我們吃臺灣菜吧！|Wǒmen chī Táiwān cài ba!|Chúng ta ăn món Đài Loan nhé!
我們看臺灣電影吧！|Wǒmen kàn Táiwān diànyǐng ba!|Chúng ta xem phim Đài Loan đi!
好，我們走吧。|Hǎo, wǒmen zǒu ba.|Được, chúng ta đi thôi.`],
["還是 (háishi) — hay là (câu hỏi lựa chọn)","A 還是 B？","Dùng trong câu hỏi, đưa ra hai lựa chọn. Câu trần thuật dùng 或者.",`今天晚上你想看書還是看電影？|Jīntiān wǎnshang nǐ xiǎng kàn shū háishi kàn diànyǐng?|Tối nay bạn muốn đọc sách hay xem phim?
你想今天還是明天去？|Nǐ xiǎng jīntiān háishi míngtiān qù?|Bạn muốn đi hôm nay hay ngày mai?
你喝茶還是喝咖啡？|Nǐ hē chá háishi hē kāfēi?|Bạn uống trà hay cà phê?`],
["覺得 và 怎麼樣","S + 覺得 + câu   |   … ，怎麼樣？","覺得 = cảm thấy, nghĩ rằng. 怎麼樣 dùng để hỏi ý kiến hoặc đánh giá.",`你覺得打棒球好玩嗎？|Nǐ juéde dǎ bàngqiú hǎowán ma?|Bạn thấy chơi bóng chày vui không?
我覺得很好玩。|Wǒ juéde hěn hǎowán.|Tôi thấy rất vui.
我們明天去打籃球，怎麼樣？|Wǒmen míngtiān qù dǎ lánqiú, zěnmeyàng?|Ngày mai chúng ta đi chơi bóng rổ, được không?`],
["也 và 都 với tân ngữ ghép","S + 也 + V   |   N1、N2，S + 都 + V","也 = cũng; 都 = đều. Khi liệt kê hai thứ rồi tóm lại dùng 都.",`我常聽音樂，也常運動。|Wǒ cháng tīng yīnyuè, yě cháng yùndòng.|Tôi thường nghe nhạc, cũng thường vận động.
越南菜、日本菜，我都想吃。|Yuènán cài, Rìběn cài, wǒ dōu xiǎng chī.|Món Việt, món Nhật tôi đều muốn ăn.
他們都想學中文。|Tāmen dōu xiǎng xué Zhōngwén.|Họ đều muốn học tiếng Trung.`]
],
s:`Cuối tuần bạn thường làm gì?|週末你常做什麼？|Zhōumò nǐ cháng zuò shénme?
Cuối tuần tôi muốn đi bơi.|週末我想去游泳。|Zhōumò wǒ xiǎng qù yóuyǒng.
Anh ấy thường đi đánh quần vợt.|他常去打網球。|Tā cháng qù dǎ wǎngqiú.
Bạn thích làm gì?|你喜歡做什麼？|Nǐ xǐhuān zuò shénme?
Tôi thích đọc sách.|我喜歡看書。|Wǒ xǐhuān kàn shū.
Bạn thấy chơi bóng chày vui không?|你覺得打棒球好玩嗎？|Nǐ juéde dǎ bàngqiú hǎowán ma?
Tôi thấy rất vui.|我覺得很好玩。|Wǒ juéde hěn hǎowán.
Chúng ta ăn món Đài Loan nhé!|我們吃臺灣菜吧！|Wǒmen chī Táiwān cài ba!
Tối nay bạn muốn đọc sách hay xem phim?|今天晚上你想看書還是看電影？|Jīntiān wǎnshang nǐ xiǎng kàn shū háishi kàn diànyǐng?
Món Việt, món Nhật tôi đều muốn ăn.|越南菜、日本菜，我都想吃。|Yuènán cài, Rìběn cài, wǒ dōu xiǎng chī.
Ngày mai chúng ta đi chơi bóng rổ, được không?|我們明天去打籃球，怎麼樣？|Wǒmen míngtiān qù dǎ lánqiú, zěnmeyàng?
Được thôi, tôi cũng muốn đi.|好啊，我也想去。|Hǎo a, wǒ yě xiǎng qù.
Bố tôi thích thể thao và chụp ảnh.|我爸爸喜歡運動和照相。|Wǒ bàba xǐhuān yùndòng hé zhào xiàng.
Tôi thường nghe nhạc, cũng thường vận động.|我常聽音樂，也常運動。|Wǒ cháng tīng yīnyuè, yě cháng yùndòng.
Họ đều muốn học tiếng Trung.|他們都想學中文。|Tāmen dōu xiǎng xué Zhōngwén.
Nhà tôi có bốn người. Bố thích thể thao, cuối tuần thường đi đánh quần vợt. Mẹ thích nghe nhạc. Em gái thích xem phim, cũng thích bơi. Còn tôi? Tôi thích đá bóng, cuối tuần thường cùng bạn đi đá.|我家有四個人。爸爸喜歡運動，週末常去打網球。媽媽喜歡聽音樂。妹妹喜歡看電影，也喜歡游泳。我呢？我喜歡踢足球，週末常和朋友一起去踢。|Wǒ jiā yǒu sì ge rén. Bàba xǐhuān yùndòng, zhōumò cháng qù dǎ wǎngqiú. Māma xǐhuān tīng yīnyuè. Mèimei xǐhuān kàn diànyǐng, yě xǐhuān yóuyǒng. Wǒ ne? Wǒ xǐhuān tī zúqiú, zhōumò cháng hé péngyou yìqǐ qù tī.`,
o:`Cuối tuần tôi muốn đi bơi.|週末 我 想 去 游泳
Chúng ta ăn món Đài Loan nhé.|我們 吃 臺灣菜 吧
Tối nay bạn muốn đọc sách hay xem phim?|今天 晚上 你 想 看書 還是 看 電影`},

s:`Mì bò thật ngon!|牛肉麵真好吃！|Niúròu miàn zhēn hǎochī!

Phòng bên cạnh hơi ồn.|旁邊的房間有一點吵。|Pángbiān de fángjiān yǒu yìdiǎn chǎo.
Bạn xem nhà trước rồi hãy quyết định.|你先看房子，再決定。|Nǐ xiān kàn fángzi, zài juédìng.
Trong phòng có giường, bàn và ghế.|房間裡有床、桌子和椅子。|Fángjiān lǐ yǒu chuáng, zhuōzi hé yǐzi.
Bạn cùng phòng của tôi là người Nhật.|我的室友是日本人。|Wǒ de shìyǒu shì Rìběn rén.
Chủ nhà nói tôi có thể nấu cơm trong bếp.|房東說我可以在廚房做飯。|Fángdōng shuō wǒ kěyǐ zài chúfáng zuò fàn.

Tối mai tôi mời bạn bè đến nhà ăn bánh kem.|明天晚上我請朋友來我家吃蛋糕。|Míngtiān wǎnshang wǒ qǐng péngyou lái wǒ jiā chī dàngāo.
Bạn muốn tổ chức sinh nhật ở đâu?|你想在哪裡過生日？|Nǐ xiǎng zài nǎlǐ guò shēngrì?

Anh trai tôi lớn hơn tôi ba tuổi.|我哥哥比我大三歲。|Wǒ gēge bǐ wǒ dà sān suì.

Ngày mai là sinh nhật của bạn tôi. Tôi muốn mua một chiếc bánh kem và một món quà. Tôi mời bạn học đến nhà ăn bánh kem. Chúng tôi cùng hát, anh ấy nhất định sẽ rất bất ngờ.|明天是我朋友的生日。我想買一個蛋糕和一個禮物。我請同學來我家吃蛋糕。我們一起唱歌，他一定很驚喜。|Míngtiān shì wǒ péngyou de shēngrì. Wǒ xiǎng mǎi yí ge dàngāo hé yí ge lǐwù. Wǒ qǐng tóngxué lái wǒ jiā chī dàngāo. Wǒmen yìqǐ chàng gē, tā yídìng hěn jīngxǐ.`,
o:`Chúc mừng sinh nhật!|生日 快樂

s:`Tôi rất khó chịu trong người.|我很不舒服。|Wǒ hěn bù shūfu.

Bạn nên đi ngủ sớm một chút.|你應該早點睡覺。|Nǐ yīnggāi zǎodiǎn shuì jiào.
Đừng ăn đồ lạnh.|別吃冰的。|Bié chī bīng de.
Đừng quên uống thuốc.|別忘了吃藥。|Bié wàng le chī yào.

Hôm nay tôi hơi mệt, không muốn đi học.|今天我有點累，不想去上課。|Jīntiān wǒ yǒudiǎn lèi, bù xiǎng qù shàng kè.

13:{t:"Sinh nhật vui vẻ",l:`小美|明天是你的生日，生日快樂！|Míngtiān shì nǐ de shēngrì, shēngrì kuàilè!|Ngày mai là sinh nhật bạn, chúc mừng sinh nhật!

14:{t:"Trời lạnh quá",l:`大明|今天天氣這麼冷！|Jīntiān tiānqì zhème lěng!|Hôm nay trời lạnh thế này!
小美|是啊，今天只有十二度，比昨天冷。|Shì a, jīntiān zhǐyǒu shí'èr dù, bǐ zuótiān lěng.|Đúng vậy, hôm nay chỉ có 12 độ, lạnh hơn hôm qua.
大明|明天呢？|Míngtiān ne?|Còn ngày mai?
小美|天氣預報說明天更冷，可能會下雨。|Tiānqì yùbào shuō míngtiān gèng lěng, kěnéng huì xià yǔ.|Dự báo thời tiết nói ngày mai lạnh hơn, có thể sẽ mưa.
大明|那我們明天還去爬山嗎？|Nà wǒmen míngtiān hái qù pá shān ma?|Vậy ngày mai chúng ta còn đi leo núi không?
小美|要是下雨，我們就不去了。|Yàoshi xià yǔ, wǒmen jiù bú qù le.|Nếu mưa thì chúng ta không đi nữa.
大明|好。你要穿外套，也要帶雨傘。|Hǎo. Nǐ yào chuān wàitào, yě yào dài yǔsǎn.|Được. Bạn phải mặc áo khoác và mang ô nữa.
小美|好，謝謝你！|Hǎo, xièxie nǐ!|Được, cảm ơn bạn!`,
q:`Hôm nay 12 độ.|O
Hôm nay ấm hơn hôm qua.|X
Nếu mai mưa họ vẫn đi leo núi.|X
Dự báo nói ngày mai lạnh hơn.|O`},
15:{t:"Khám bệnh",l:`醫生|你哪裡不舒服？|Nǐ nǎlǐ bù shūfu?|Bạn khó chịu ở đâu?
安同|我頭痛，喉嚨也很痛。|Wǒ tóu tòng, hóulóng yě hěn tòng.|Tôi đau đầu, họng cũng rất đau.
醫生|你發燒嗎？|Nǐ fā shāo ma?|Bạn có sốt không?
安同|有一點發燒，我還咳嗽。|Yǒu yìdiǎn fā shāo, wǒ hái késou.|Hơi sốt, tôi còn ho nữa.
醫生|你感冒了。你要吃藥，也要多休息，多喝水。|Nǐ gǎnmào le. Nǐ yào chī yào, yě yào duō xiūxí, duō hē shuǐ.|Bạn bị cảm rồi. Bạn phải uống thuốc, nghỉ ngơi nhiều và uống nhiều nước.
安同|我可以去上課嗎？|Wǒ kěyǐ qù shàng kè ma?|Tôi đi học được không?
醫生|這兩天別去上課了，在家休息吧。|Zhè liǎng tiān bié qù shàng kè le, zài jiā xiūxí ba.|Hai ngày nay đừng đi học, ở nhà nghỉ ngơi đi.
安同|好，謝謝醫生。|Hǎo, xièxie yīshēng.|Được, cảm ơn bác sĩ.`,

{n:1,zh:"新朋友",vi:"Người bạn mới",l:`小美是臺灣人。|Xiǎo Měi shì Táiwān rén.|Tiểu Mỹ là người Đài Loan.

{n:2,zh:"我的家",vi:"Gia đình tôi",l:`我家有五個人。|Wǒ jiā yǒu wǔ ge rén.|Nhà tôi có năm người.

{n:3,zh:"快樂的週末",vi:"Một cuối tuần vui vẻ",l:`週末到了，小明很開心。|Zhōumò dào le, Xiǎo Míng hěn kāixīn.|Cuối tuần đến rồi, Tiểu Minh rất vui.

{n:4,zh:"買早餐",vi:"Mua bữa sáng",l:`今天早上，安同去買早餐。|Jīntiān zǎoshang, Āntóng qù mǎi zǎocān.|Sáng nay, An Đồng đi mua bữa sáng.

{n:5,zh:"牛肉麵",vi:"Mì bò",l:`月美的朋友想吃牛肉麵。|Yuèměi de péngyou xiǎng chī niúròu miàn.|Bạn của Nguyệt Mỹ muốn ăn mì bò.

{n:6,zh:"我們的學校",vi:"Trường của chúng tôi",l:`我的學校在山上。|Wǒ de xuéxiào zài shānshàng.|Trường của tôi ở trên núi.

{n:7,zh:"忙碌的一天",vi:"Một ngày bận rộn",l:`小王每天六點起床。|Xiǎo Wáng měitiān liù diǎn qǐ chuáng.|Tiểu Vương mỗi ngày sáu giờ thức dậy.

{n:8,zh:"去臺南",vi:"Đi Đài Nam",l:`週末，如玉想去臺南玩。|Zhōumò, Rúyù xiǎng qù Táinán wán.|Cuối tuần, Như Ngọc muốn đi Đài Nam chơi.

{n:9,zh:"放假去花蓮",vi:"Nghỉ lễ đi Hoa Liên",l:`下個月我們放三天假。|Xià ge yuè wǒmen fàng sān tiān jià.|Tháng sau chúng tôi nghỉ ba ngày.

{n:10,zh:"田中的水果",vi:"Trái cây của Điền Trung",l:`田中是我的日本朋友。|Tiánzhōng shì wǒ de Rìběn péngyou.|Điền Trung là bạn người Nhật của tôi.

{n:11,zh:"租房子",vi:"Thuê nhà",l:`安同想在學校附近租房子。|Āntóng xiǎng zài xuéxiào fùjìn zū fángzi.|An Đồng muốn thuê nhà gần trường.

{n:12,zh:"我的中文",vi:"Tiếng Trung của tôi",l:`我在臺灣學了一年的中文。|Wǒ zài Táiwān xué le yì nián de Zhōngwén.|Tôi đã học tiếng Trung ở Đài Loan một năm.

她說：謝謝你們！這是我最好的生日。|Tā shuō: Xièxie nǐmen! Zhè shì wǒ zuì hǎo de shēngrì.|Cô ấy nói: Cảm ơn các bạn! Đây là sinh nhật tuyệt nhất của tôi.`},
{n:14,zh:"下雨了",vi:"Trời mưa rồi",l:`今天天氣這麼冷！|Jīntiān tiānqì zhème lěng!|Hôm nay trời lạnh thế này!
天氣預報說下午會下雨。|Tiānqì yùbào shuō xiàwǔ huì xià yǔ.|Dự báo thời tiết nói buổi chiều sẽ mưa.
媽媽說：你要穿外套，也要帶雨傘。|Māma shuō: Nǐ yào chuān wàitào, yě yào dài yǔsǎn.|Mẹ nói: Con phải mặc áo khoác, cũng phải mang ô.
小明帶了雨傘去學校。|Xiǎo Míng dài le yǔsǎn qù xuéxiào.|Tiểu Minh mang ô đến trường.
下午真的下雨了。|Xiàwǔ zhēnde xià yǔ le.|Buổi chiều trời thật sự mưa rồi.
同學都沒有帶傘，小明請他們一起走。|Tóngxué dōu méiyǒu dài sǎn, Xiǎo Míng qǐng tāmen yìqǐ zǒu.|Các bạn học đều không mang ô, Tiểu Minh mời họ đi chung.
大家都說：謝謝你，小明！|Dàjiā dōu shuō: Xièxie nǐ, Xiǎo Míng!|Mọi người đều nói: Cảm ơn bạn, Tiểu Minh!`},
{n:15,zh:"生病了",vi:"Bị ốm",l:`昨天天氣冷，安同感冒了。|Zuótiān tiānqì lěng, Āntóng gǎnmào le.|Hôm qua trời lạnh, An Đồng bị cảm.
他頭痛，喉嚨也很痛。|Tā tóu tòng, hóulóng yě hěn tòng.|Anh ấy đau đầu, họng cũng rất đau.
今天他去醫院看醫生。|Jīntiān tā qù yīyuàn kàn yīshēng.|Hôm nay anh ấy đến bệnh viện khám bác sĩ.
醫生說：你要吃藥，也要多休息。|Yīshēng shuō: Nǐ yào chī yào, yě yào duō xiūxí.|Bác sĩ nói: Bạn phải uống thuốc, cũng phải nghỉ ngơi nhiều.
還要多喝水，別吃冰的。|Hái yào duō hē shuǐ, bié chī bīng de.|Còn phải uống nhiều nước, đừng ăn đồ lạnh.
安同回家吃藥，早點睡覺。|Āntóng huí jiā chī yào, zǎodiǎn shuì jiào.|An Đồng về nhà uống thuốc, đi ngủ sớm.
兩天以後，他好多了。|Liǎng tiān yǐhòu, tā hǎo duō le.|Hai ngày sau, anh ấy khỏe hơn nhiều.`}

風景真漂亮，我照了很多照片。|Fēngjǐng zhēn piàoliang, wǒ zhào le hěn duō zhàopiàn.|Phong cảnh thật đẹp, tôi chụp rất nhiều ảnh.
我覺得住在山上很舒服。|Wǒ juéde zhù zài shānshàng hěn shūfu.|Tôi thấy sống trên núi rất dễ chịu.`},
{n:7,zh:"星期五的電影",vi:"Bộ phim tối thứ Sáu",l:`星期五晚上，小王想看電影。|Xīngqíwǔ wǎnshang, Xiǎo Wáng xiǎng kàn diànyǐng.|Tối thứ Sáu, Tiểu Vương muốn xem phim.
電影七點開始，九點結束。|Diànyǐng qī diǎn kāishǐ, jiǔ diǎn jiéshù.|Phim bắt đầu lúc bảy giờ, kết thúc lúc chín giờ.
他六點半吃晚飯。|Tā liù diǎn bàn chī wǎnfàn.|Anh ấy ăn tối lúc sáu giờ rưỡi.
然後他坐捷運去看電影。|Ránhòu tā zuò jiéyùn qù kàn diànyǐng.|Sau đó anh ấy đi tàu điện ngầm đến xem phim.
電影很有意思，他覺得很開心。|Diànyǐng hěn yǒu yìsi, tā juéde hěn kāixīn.|Phim rất thú vị, anh ấy thấy rất vui.
回到家已經十一點了。|Huí dào jiā yǐjīng shíyī diǎn le.|Về đến nhà đã mười một giờ rồi.`},
{n:7,zh:"起床太晚了",vi:"Dậy muộn",l:`今天早上八點上課。|Jīntiān zǎoshang bā diǎn shàng kè.|Sáng nay tám giờ vào học.
可是我七點五十才起床。|Kěshì wǒ qī diǎn wǔshí cái qǐ chuáng.|Nhưng bảy giờ năm mươi tôi mới thức dậy.
我很快去學校，可是還是晚了。|Wǒ hěn kuài qù xuéxiào, kěshì háishi wǎn le.|Tôi nhanh chóng đến trường nhưng vẫn muộn.
老師說：沒關係，請進。|Lǎoshī shuō: Méi guānxi, qǐng jìn.|Thầy giáo nói: Không sao, mời vào.
我說：對不起，老師！|Wǒ shuō: Duìbuqǐ, lǎoshī!|Tôi nói: Xin lỗi thầy!
明天我一定早一點起床。|Míngtiān wǒ yídìng zǎo yìdiǎn qǐ chuáng.|Ngày mai tôi nhất định sẽ dậy sớm hơn một chút.`},
{n:8,zh:"每天坐捷運",vi:"Mỗi ngày đi tàu điện ngầm",l:`我住在學校附近，每天坐捷運去上課。|Wǒ zhù zài xuéxiào fùjìn, měitiān zuò jiéyùn qù shàng kè.|Tôi sống gần trường, mỗi ngày đi tàu điện ngầm đến lớp.
捷運又快又舒服，也不貴。|Jiéyùn yòu kuài yòu shūfu, yě bú guì.|Tàu điện ngầm vừa nhanh vừa thoải mái, cũng không đắt.
從我家到學校要十五分鐘。|Cóng wǒ jiā dào xuéxiào yào shíwǔ fēnzhōng.|Từ nhà tôi đến trường mất mười lăm phút.
公車比捷運慢，所以我不常坐。|Gōngchē bǐ jiéyùn màn, suǒyǐ wǒ bù cháng zuò.|Xe buýt chậm hơn tàu điện ngầm, nên tôi không hay đi.
週末我也坐捷運去看朋友。|Zhōumò wǒ yě zuò jiéyùn qù kàn péngyou.|Cuối tuần tôi cũng đi tàu điện ngầm đi thăm bạn.
我覺得臺灣的捷運很方便。|Wǒ juéde Táiwān de jiéyùn hěn fāngbiàn.|Tôi thấy tàu điện ngầm Đài Loan rất tiện.`},
{n:8,zh:"騎機車去故宮",vi:"Đi xe máy đến Cố Cung",l:`我的朋友有機車。|Wǒ de péngyou yǒu jīchē.|Bạn tôi có xe máy.
他騎機車去學校，比坐公車快。|Tā qí jīchē qù xuéxiào, bǐ zuò gōngchē kuài.|Anh ấy đi xe máy đến trường, nhanh hơn đi xe buýt.
今天他騎機車載我去故宮。|Jīntiān tā qí jīchē zài wǒ qù Gùgōng.|Hôm nay anh ấy chở tôi bằng xe máy đến Cố Cung.
路上的風景很漂亮。|Lù shàng de fēngjǐng hěn piàoliang.|Phong cảnh trên đường rất đẹp.
可是他騎得太快了，我說：請慢一點！|Kěshì tā qí de tài kuài le, wǒ shuō: Qǐng màn yìdiǎn!|Nhưng anh ấy đi nhanh quá, tôi nói: Làm ơn chậm một chút!
他笑了，說：好，我們慢慢走。|Tā xiào le, shuō: Hǎo, wǒmen mànman zǒu.|Anh ấy cười, nói: Được, chúng ta đi chậm thôi.`},
{n:9,zh:"田中要回國了",vi:"Điền Trung sắp về nước",l:`田中要回國了，他打算下個星期走。|Tiánzhōng yào huí guó le, tā dǎsuàn xià ge xīngqí zǒu.|Điền Trung sắp về nước, anh ấy dự định đi vào tuần sau.
他在臺灣學了一年的中文。|Tā zài Táiwān xué le yì nián de Zhōngwén.|Anh ấy đã học tiếng Trung ở Đài Loan một năm.
放假的時候，他去了很多地方。|Fàng jià de shíhou, tā qù le hěn duō dìfang.|Lúc nghỉ lễ, anh ấy đã đi nhiều nơi.
他最喜歡花蓮，因為風景很漂亮。|Tā zuì xǐhuān Huālián, yīnwèi fēngjǐng hěn piàoliang.|Anh ấy thích Hoa Liên nhất vì phong cảnh rất đẹp.
他說：要是有空，我一定再來。|Tā shuō: Yàoshi yǒu kòng, wǒ yídìng zài lái.|Anh ấy nói: Nếu rảnh, tôi nhất định sẽ quay lại.
大家都說：歡迎你再來！|Dàjiā dōu shuō: Huānyíng nǐ zài lái!|Mọi người đều nói: Chào mừng bạn quay lại!`},
{n:9,zh:"放假去哪裡",vi:"Nghỉ lễ đi đâu",l:`我們還不知道放假去哪裡玩。|Wǒmen hái bù zhīdào fàng jià qù nǎlǐ wán.|Chúng tôi vẫn chưa biết nghỉ lễ đi đâu chơi.
月美說：貓空不錯，有很多茶館。|Yuèměi shuō: Māokōng búcuò, yǒu hěn duō cháguǎn.|Nguyệt Mỹ nói: Miêu Không khá hay, có nhiều quán trà.
田中說：花蓮的風景非常漂亮。|Tiánzhōng shuō: Huālián de fēngjǐng fēicháng piàoliang.|Điền Trung nói: Phong cảnh Hoa Liên vô cùng đẹp.
我說：我們可以先去花蓮，再去貓空。|Wǒ shuō: Wǒmen kěyǐ xiān qù Huālián, zài qù Māokōng.|Tôi nói: Chúng ta có thể đi Hoa Liên trước, rồi đi Miêu Không.
大家都說：好啊！|Dàjiā dōu shuō: Hǎo a!|Mọi người đều nói: Được thôi!
我們決定下個星期去。|Wǒmen juédìng xià ge xīngqí qù.|Chúng tôi quyết định tuần sau đi.`},
{n:10,zh:"水果店",vi:"Cửa hàng trái cây",l:`我去水果店買水果。|Wǒ qù shuǐguǒ diàn mǎi shuǐguǒ.|Tôi đến cửa hàng trái cây mua trái cây.
老闆說：這個西瓜很甜，要不要買一個？|Lǎobǎn shuō: Zhège xīguā hěn tián, yào bu yào mǎi yí ge?|Ông chủ nói: Quả dưa hấu này rất ngọt, bạn có muốn mua một quả không?
我問：一個多少錢？|Wǒ wèn: Yí ge duōshǎo qián?|Tôi hỏi: Một quả bao nhiêu tiền?
老闆說：一個一百塊。|Lǎobǎn shuō: Yí ge yìbǎi kuài.|Ông chủ nói: Một quả một trăm tệ.
我又買了一些芒果，因為芒果又香又甜。|Wǒ yòu mǎi le yìxiē mángguǒ, yīnwèi mángguǒ yòu xiāng yòu tián.|Tôi mua thêm một ít xoài vì xoài vừa thơm vừa ngọt.
回家以後，我給朋友一個西瓜。|Huí jiā yǐhòu, wǒ gěi péngyou yí ge xīguā.|Về nhà, tôi cho bạn một quả dưa hấu.`},
{n:10,zh:"我們的衣服",vi:"Quần áo của chúng tôi",l:`今天我穿藍色的衣服。|Jīntiān wǒ chuān lánsè de yīfu.|Hôm nay tôi mặc quần áo màu xanh dương.
我朋友穿紅色的，很好看。|Wǒ péngyou chuān hóngsè de, hěn hǎokàn.|Bạn tôi mặc đồ màu đỏ, rất đẹp.
他比我高，我比他矮一點。|Tā bǐ wǒ gāo, wǒ bǐ tā ǎi yìdiǎn.|Anh ấy cao hơn tôi, tôi thấp hơn anh ấy một chút.
因為天氣冷，所以我們都穿外套。|Yīnwèi tiānqì lěng, suǒyǐ wǒmen dōu chuān wàitào.|Vì trời lạnh nên chúng tôi đều mặc áo khoác.
我們一起去拍照片。|Wǒmen yìqǐ qù pāi zhàopiàn.|Chúng tôi cùng đi chụp ảnh.
照片裡的我們都很開心。|Zhàopiàn lǐ de wǒmen dōu hěn kāixīn.|Trong ảnh chúng tôi đều rất vui.`},
{n:11,zh:"新室友",vi:"Bạn cùng phòng mới",l:`安同有一個新室友，是日本人。|Āntóng yǒu yí ge xīn shìyǒu, shì Rìběn rén.|An Đồng có một bạn cùng phòng mới, là người Nhật.
室友叫田中，他很喜歡看書。|Shìyǒu jiào Tiánzhōng, tā hěn xǐhuān kàn shū.|Bạn cùng phòng tên Điền Trung, anh ấy rất thích đọc sách.
他們的房間不大，可是很乾淨。|Tāmen de fángjiān bú dà, kěshì hěn gānjìng.|Phòng của họ không lớn nhưng rất sạch.
田中說：我可以用廚房嗎？|Tiánzhōng shuō: Wǒ kěyǐ yòng chúfáng ma?|Điền Trung nói: Tôi dùng bếp được không?
安同說：可以，你先用吧。|Āntóng shuō: Kěyǐ, nǐ xiān yòng ba.|An Đồng nói: Được, bạn dùng trước đi.
他們常常一起吃飯，也一起聊天。|Tāmen chángcháng yìqǐ chī fàn, yě yìqǐ liáo tiān.|Họ thường cùng ăn cơm, cũng cùng trò chuyện.`},
{n:11,zh:"搬家",vi:"Chuyển nhà",l:`這個月我要搬家。|Zhège yuè wǒ yào bān jiā.|Tháng này tôi sắp chuyển nhà.
新房子離學校很近。|Xīn fángzi lí xuéxiào hěn jìn.|Nhà mới cách trường rất gần.
朋友說：我來幫你搬家！|Péngyou shuō: Wǒ lái bāng nǐ bān jiā!|Bạn nói: Tôi đến giúp bạn chuyển nhà!
我們先搬床和桌子，再搬書。|Wǒmen xiān bān chuáng hé zhuōzi, zài bān shū.|Chúng tôi chuyển giường và bàn trước, rồi chuyển sách.
搬好以後，我請朋友吃飯。|Bān hǎo yǐhòu, wǒ qǐng péngyou chī fàn.|Chuyển xong, tôi mời bạn ăn cơm.
新房子很舒服，我很喜歡。|Xīn fángzi hěn shūfu, wǒ hěn xǐhuān.|Nhà mới rất dễ chịu, tôi rất thích.`},
{n:12,zh:"怎麼學中文",vi:"Học tiếng Trung thế nào",l:`我每天聽老師說中文。|Wǒ měitiān tīng lǎoshī shuō Zhōngwén.|Mỗi ngày tôi nghe thầy giáo nói tiếng Trung.
下課以後，我練習寫漢字。|Xià kè yǐhòu, wǒ liànxí xiě Hànzì.|Tan học xong, tôi luyện viết chữ Hán.
我也看中文電影，聽中文音樂。|Wǒ yě kàn Zhōngwén diànyǐng, tīng Zhōngwén yīnyuè.|Tôi cũng xem phim tiếng Trung, nghe nhạc tiếng Trung.
有時候我聽不懂，我就問老師。|Yǒu shíhou wǒ tīng bu dǒng, wǒ jiù wèn lǎoshī.|Có lúc tôi nghe không hiểu thì hỏi thầy giáo.
學了一年以後，我的中文進步了。|Xué le yì nián yǐhòu, wǒ de Zhōngwén jìnbù le.|Học một năm xong, tiếng Trung của tôi tiến bộ rồi.
老師說：你很努力！|Lǎoshī shuō: Nǐ hěn nǔlì!|Thầy giáo nói: Bạn rất chăm chỉ!`},
{n:12,zh:"明天考試",vi:"Ngày mai thi",l:`明天有中文考試，我今天要複習。|Míngtiān yǒu Zhōngwén kǎoshì, wǒ jīntiān yào fùxí.|Ngày mai có bài thi tiếng Trung, hôm nay tôi phải ôn tập.
我已經複習了三個小時。|Wǒ yǐjīng fùxí le sān ge xiǎoshí.|Tôi đã ôn tập ba tiếng rồi.
可是這個漢字我還是看不懂。|Kěshì zhège Hànzì wǒ háishi kàn bu dǒng.|Nhưng chữ Hán này tôi vẫn đọc không hiểu.
我問同學，同學教我。|Wǒ wèn tóngxué, tóngxué jiāo wǒ.|Tôi hỏi bạn học, bạn học dạy tôi.
晚上我早點睡覺。|Wǎnshang wǒ zǎodiǎn shuì jiào.|Buổi tối tôi đi ngủ sớm.
明天我一定會考得很好。|Míngtiān wǒ yídìng huì kǎo de hěn hǎo.|Ngày mai tôi nhất định sẽ thi tốt.`},
{n:13,zh:"生日禮物",vi:"Quà sinh nhật",l:`我想送朋友一個生日禮物。|Wǒ xiǎng sòng péngyou yí ge shēngrì lǐwù.|Tôi muốn tặng bạn một món quà sinh nhật.
我去店裡買了一個手錶和一張卡片。|Wǒ qù diàn lǐ mǎi le yí ge shǒubiǎo hé yì zhāng kǎpiàn.|Tôi đến cửa hàng mua một chiếc đồng hồ và một tấm thiệp.
老闆說：這是給朋友的生日禮物嗎？|Lǎobǎn shuō: Zhè shì gěi péngyou de shēngrì lǐwù ma?|Ông chủ nói: Đây là quà sinh nhật tặng bạn à?
我說：是的，謝謝。|Wǒ shuō: Shì de, xièxie.|Tôi nói: Vâng, cảm ơn.
朋友收到禮物，非常開心。|Péngyou shōudào lǐwù, fēicháng kāixīn.|Bạn nhận được quà, vô cùng vui.
他說：謝謝你，我很喜歡！|Tā shuō: Xièxie nǐ, wǒ hěn xǐhuān!|Bạn nói: Cảm ơn bạn, mình rất thích!`},
{n:13,zh:"我家人的年紀",vi:"Tuổi của người nhà tôi",l:`我哥哥今年三十歲，我二十五歲。|Wǒ gēge jīnnián sānshí suì, wǒ èrshíwǔ suì.|Anh trai tôi năm nay ba mươi tuổi, tôi hai mươi lăm tuổi.
他比我大五歲。|Tā bǐ wǒ dà wǔ suì.|Anh ấy lớn hơn tôi năm tuổi.
妹妹今年十八歲，是大學生。|Mèimei jīnnián shíbā suì, shì dàxuéshēng.|Em gái năm nay mười tám tuổi, là sinh viên đại học.
爸爸五十五歲，媽媽五十三歲。|Bàba wǔshíwǔ suì, māma wǔshísān suì.|Bố năm mươi lăm tuổi, mẹ năm mươi ba tuổi.
我們家人的生日都不一樣。|Wǒmen jiārén de shēngrì dōu bù yíyàng.|Sinh nhật của người nhà chúng tôi đều khác nhau.
我們常常一起吃蛋糕。|Wǒmen chángcháng yìqǐ chī dàngāo.|Chúng tôi thường cùng nhau ăn bánh kem.`},
{n:14,zh:"臺灣的四季",vi:"Bốn mùa ở Đài Loan",l:`臺灣有春天、夏天、秋天和冬天。|Táiwān yǒu chūntiān, xiàtiān, qiūtiān hé dōngtiān.|Đài Loan có mùa xuân, mùa hè, mùa thu và mùa đông.
春天很暖和，夏天又熱又濕。|Chūntiān hěn nuǎnhuo, xiàtiān yòu rè yòu shī.|Mùa xuân rất ấm áp, mùa hè vừa nóng vừa ẩm.
秋天涼涼的，很舒服。|Qiūtiān liángliáng de, hěn shūfu.|Mùa thu mát mẻ, rất dễ chịu.
冬天有一點冷，山上更冷。|Dōngtiān yǒu yìdiǎn lěng, shānshàng gèng lěng.|Mùa đông hơi lạnh, trên núi còn lạnh hơn.
我最喜歡秋天，因為天氣很好。|Wǒ zuì xǐhuān qiūtiān, yīnwèi tiānqì hěn hǎo.|Tôi thích mùa thu nhất vì thời tiết rất đẹp.
你喜歡哪一個？|Nǐ xǐhuān nǎ yí ge?|Bạn thích mùa nào?`},
{n:14,zh:"去爬山",vi:"Đi leo núi",l:`星期天天氣很好，我們去爬山。|Xīngqítiān tiānqì hěn hǎo, wǒmen qù pá shān.|Chủ nhật thời tiết đẹp, chúng tôi đi leo núi.
山上比山下涼，我們都穿外套。|Shānshàng bǐ shānxià liáng, wǒmen dōu chuān wàitào.|Trên núi mát hơn dưới núi, chúng tôi đều mặc áo khoác.
爬了兩個小時，我們有一點累。|Pá le liǎng ge xiǎoshí, wǒmen yǒudiǎn lèi.|Leo hai tiếng, chúng tôi hơi mệt.
可是山上的風景非常漂亮。|Kěshì shānshàng de fēngjǐng fēicháng piàoliang.|Nhưng phong cảnh trên núi vô cùng đẹp.
我們在山上吃東西，也照了很多照片。|Wǒmen zài shānshàng chī dōngxi, yě zhào le hěn duō zhàopiàn.|Chúng tôi ăn đồ trên núi, cũng chụp rất nhiều ảnh.
要是天氣好，下次我們還要來。|Yàoshi tiānqì hǎo, xiàcì wǒmen hái yào lái.|Nếu thời tiết đẹp, lần sau chúng tôi còn muốn đến.`},

function toast(m){

function voiceList(){return [pick()].filter(Boolean)}
function say(t,o){
  if(!("speechSynthesis" in window)){toast("Trình duyệt này không có giọng đọc tích hợp.");return}
  const list=voiceList(),k=o.k||0,v=list[k],u=new SpeechSynthesisUtterance(t);
  u.lang=v?v.lang:"zh-TW";if(v)u.voice=v;
  u.rate=o.rate||parseFloat($("#rate").value);u.pitch=o.pitch||1;u.volume=1;
  let started=false,failed=false;
  const fallback=why=>{
    if(failed)return;failed=true;
    if(k+1<list.length){speechSynthesis.cancel();setTimeout(()=>say(t,{...o,k:k+1}),120)}
    else toast("Không phát được âm thanh ("+why+"). Kiểm tra âm lượng máy / tab có bị tắt tiếng không, hoặc thử mở web bằng Safari.");
  };
  u.onstart=()=>{started=true};
  u.onend=()=>{started=true;if(o.onend&&!failed)o.onend()};
  u.onerror=e=>{if(e.error==="canceled"||e.error==="interrupted")return;fallback(e.error)};
  keepU=u;                                   // giữ tham chiếu để trình duyệt không thu hồi giữa chừng
  if(speechSynthesis.paused)speechSynthesis.resume();
  speechSynthesis.speak(u);
  setTimeout(()=>{if(!started&&!failed&&keepU===u)fallback("giọng không phản hồi: "+(v?v.name:"mặc định"))},2500);   // giọng bị treo → đổi giọng khác
}
/* ---- Giọng thu sẵn (audio/*.m4a): chạy được trên mọi trình duyệt, kể cả Chrome không có giọng đọc ---- */
const cyrb53=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const clipUrl=(t,tag)=>"audio/"+cyrb53((tag||"m")+"|"+t).toString(36)+".m4a";   // giọng duy nhất: Meijia
const useClips=()=>true;   // chỉ dùng một giọng: Meijia (file thu sẵn)
let curA=null;
function playClip(t,o){        // o:{tag,rate,onend,onfail}
  const a=new Audio(clipUrl(t,o.tag));curA=a;
  a.playbackRate=Math.max(0.5,o.rate||parseFloat($("#rate").value));
  let done=false;
  const fail=()=>{if(done||curA!==a)return;done=true;if(o.onfail)o.onfail()};
  a.onerror=fail;
  a.onended=()=>{if(done||curA!==a)return;done=true;if(o.onend)o.onend()};
  const p=a.play();
  if(p&&p.catch)p.catch(e=>{if(e&&e.name==="NotAllowedError")toast("Trình duyệt chặn âm thanh, hãy bấm lại nút nghe.");fail()});
}
function speakTTS(t,rate){
  if(!("speechSynthesis" in window)){toast("Trình duyệt này không có giọng đọc tích hợp.");return}
  const busy=speechSynthesis.speaking||speechSynthesis.pending;
  if(busy)speechSynthesis.cancel();const tk=++sTok;
  setTimeout(()=>{if(tk===sTok)say(t,{rate})},busy?120:0);   // chờ một chút sau cancel(): Chrome hay nuốt câu đọc nếu speak() ngay lập tức
}
function speak(t,rate,tag){
  stopSpeak();const tk=++sTok;
  if(useClips()){playClip(t,{tag,rate,onfail:()=>{if(tk===sTok)speakTTS(t,rate)}});return}   // thiếu file thu sẵn → dùng giọng của trình duyệt
  speakTTS(t,rate);
}

/* ============ CHÚ THÍCH PINYIN + NGHĨA CHO TIÊU ĐỀ / CÔNG THỨC NGỮ PHÁP ============ */
const EXTRA={"游":["yóu","bơi"],"好":["hǎo","tốt"],"多":["duō","nhiều"],"裡":["lǐ","bên trong"]};   // từ/ký tự ngữ pháp chưa nằm trong danh sách từ vựng
const DICT=(()=>{const d={};VOCAB.forEach(v=>{d[v[0]]=[v[1],v[2]]});Object.assign(d,EXTRA);return d})();
const isHan=c=>/[\u4e00-\u9fff]/.test(c);
function annotate(s){   // → {html: chữ Hán có pinyin phía trên, gloss: [[hán, pinyin, nghĩa]…]}
  let html="",gloss=[],seen=new Set(),i=0;
  while(i<s.length){
    if(!isHan(s[i])){let j=i;while(j<s.length&&!isHan(s[j]))j++;html+=esc(s.slice(i,j));i=j;continue}
    let k=0;
    for(let L=Math.min(6,s.length-i);L>=1;L--){if(DICT[s.slice(i,i+L)]&&[...s.slice(i,i+L)].every(isHan)){k=L;break}}
    if(k){const w=s.slice(i,i+k),[py,vi]=DICT[w];html+=`<ruby class="tap" onclick="speak('${w}')">${w}<rt>${py}</rt></ruby>`;if(!seen.has(w)){seen.add(w);gloss.push([w,py,vi])}i+=k}
    else{html+=s[i];i++}
  }
  return {html,gloss};
}
const glossHtml=g=>g.length?`<div class="gloss">${g.map(x=>`<span class="tap" onclick="speak('${x[0]}')"><b class="zh">${x[0]}</b> <i>${x[1]}</i> = ${x[2]} 🔊</span>`).join("")}</div>`:"";

let rPy=true,rVi=true,rTok=0,rAns={};
function stopSpeak(){rTok++;sTok++;if(curA){curA.pause();curA=null}if("speechSynthesis" in window&&(speechSynthesis.speaking||speechSynthesis.pending))speechSynthesis.cancel()}
function speakSeq(items){      // đọc lần lượt từng câu; item: {t, tag, pitch}
  stopSpeak();const tok=++rTok;let i=0;
  const next=()=>{
    if(tok!==rTok||i>=items.length)return;
    const it=items[i++],after=()=>setTimeout(next,350);
    if(useClips())playClip(it.t,{tag:it.tag,onend:after,onfail:()=>{if(tok===rTok)say(it.t,{pitch:it.pitch,onend:after})}});
    else say(it.t,{pitch:it.pitch,onend:after});
  };
  setTimeout(()=>{if(tok===rTok)next()},60);
}

  speakSeq(L.map(x=>({t:x[1],tag:"m",pitch:1})));
}

    });
  });
  $("#app").innerHTML=html||"<div class='card vi'>Chưa có bài đọc cho phạm vi này.</div>";
}

/* ============ TRUYỆN ĐỌC + CHẤM PHÁT ÂM ============ */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;   // nhận dạng giọng nói của trình duyệt (Chrome, Safari)
let rec=null,recKey="";
const idleMics=()=>document.querySelectorAll(".mic").forEach(b=>{b.classList.remove("rec");b.textContent=b.dataset.label||"🎤 Đọc thử"});
function stopRec(){            // hủy hẳn (đổi tab, bấm câu khác): không chấm
  const S=rec;rec=null;recKey="";
  if(S){S.done=true;S.userStop=true;clearTimeout(S.timer);clearInterval(S.tick);try{S.r.abort()}catch(e){}}
  idleMics();
}
const NAMES=/小美|大衛|大明|小明|安同|如玉|月美|美月|田中|小王|怡君|開文/g;   // tên riêng: bộ nhận dạng hay viết khác chữ nên không chấm
// Tách câu thành các từ theo từ điển của web (từ dài nhất trước); chữ lạ tách từng chữ
function segmentWords(s){
  const cs=[...s].filter(isHan),raw=cs.join(""),out=[];let i=0;
  const names=[];let mm;NAMES.lastIndex=0;while((mm=NAMES.exec(raw)))names.push([mm.index,mm[0].length]);
  while(i<cs.length){
    const nm=names.find(x=>x[0]===i);if(nm){out.push(raw.slice(i,i+nm[1]));i+=nm[1];continue}   // tên riêng là một từ
    let k=1;for(let L=Math.min(6,cs.length-i);L>=2;L--){if(DICT[cs.slice(i,i+L).join("")]){k=L;break}}
    out.push(cs.slice(i,i+k).join(""));i+=k;
  }
  return out;
}
const DIGH="零一二三四五六七八九";
function numHan(n){   // 0–9999 → chữ Hán (110 → 一百一十)
  if(n<10)return DIGH[n];
  if(n<100){const t=n/10|0,u=n%10;return(t>1?DIGH[t]:"")+"十"+(u?DIGH[u]:"")}
  let s="",r=n,started=false,zero=false;
  for(const [v,u] of [[1000,"千"],[100,"百"]]){const q=r/v|0;if(q){if(zero)s+="零";s+=DIGH[q]+u;started=true;zero=false}else if(started)zero=true;r%=v}
  if(r){if(zero||(started&&r<10))s+="零";if(r<10)s+=DIGH[r];else{const t=r/10|0,u=r%10;s+=DIGH[t]+"十"+(u?DIGH[u]:"")}}
  return s;
}
const digHan=s=>s.replace(/\d+/g,m=>+m<=9999?numHan(+m):[...m].map(d=>DIGH[+d]).join(""));
const EQV={"兩":"二","她":"他","牠":"他","妳":"你","裏":"裡","台":"臺"};   // các chữ nghe giống nhau, không tính là sai
const normHan=s=>[...digHan(s)].map(c=>S2T[c]||c).filter(isHan).map(c=>EQV[c]||c);
// So chữ Hán nhận dạng được với văn bản mẫu bằng LCS; tên riêng không chấm. Dùng được cho một câu hoặc cả truyện.
function alignHits(target,heard){
  const raw=[...target].filter(isHan).join(""),T=normHan(target),H=normHan(heard);
  const skip=new Array(T.length).fill(false);let mm;NAMES.lastIndex=0;
  while((mm=NAMES.exec(raw)))for(let k=0;k<mm[0].length;k++)skip[mm.index+k]=true;
  const idx=T.map((_,i)=>i).filter(i=>!skip[i]),T2=idx.map(i=>T[i]),n=T2.length,m=H.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=T2[i-1]===H[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const hit=T.map((_,i)=>skip[i]);let i=n,j=m,ok=0;
  while(i>0&&j>0){if(T2[i-1]===H[j-1]){hit[idx[i-1]]=true;ok++;i--;j--}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--}
  return{T,H,skip,hit,n,ok,score:n?ok/n:1};
}
function wordMarks(sentence,A,offset){   // đánh dấu từng từ của một câu nằm ở vị trí offset trong văn bản mẫu
  let pos=offset;
  return segmentWords(sentence).map(w=>{
    const len=[...w].length,ok=A.hit.slice(pos,pos+len).every(Boolean),name=A.skip.slice(pos,pos+len).every(Boolean);pos+=len;
    const d=DICT[w];return{w,ok,name,py:d?d[0]:"",vi:d?d[1]:""};
  });
}
function sentScore(A,offset,len){let n=0,ok=0;for(let k=offset;k<offset+len;k++)if(!A.skip[k]){n++;if(A.hit[k])ok++}return n?ok/n:1}
function compareRead(target,heard){
  const A=alignHits(target,heard);
  return{score:A.score,marks:wordMarks(target,A,0),heard:A.H.join("")};
}
function bestAlt(target,alts){   // trình duyệt đưa vài phương án nghe; lấy phương án gần câu mẫu nhất
  const T=normHan(target);let best=alts[0]||"",bs=-1;
  alts.forEach(t=>{const H=normHan(t),pool=[...T];let s=0;H.forEach(c=>{const i=pool.indexOf(c);if(i>=0){s++;pool.splice(i,1)}});if(s>bs){bs=s;best=t}});
  return best;
}
function storyBest(si,li){return (prog.say||{})[skey(si,li)]||0}
const chipsHtml=marks=>`<div class="words">${marks.map(m=>`<span class="w ${m.name?"name":m.ok?"ok":"bad"} tap" onclick="speak('${m.w}')">${m.w}<small>${m.name?"tên riêng":m.py}</small></span>`).join("")}</div>`;
const needHtml=marks=>{const bad=marks.filter(m=>!m.ok&&!m.name);return bad.length?`<div class="stat">Cần luyện: ${bad.map(m=>`<b class="zh">${m.w}</b> ${m.py}${m.vi?" ("+m.vi+")":""}`).join(" · ")}</div>`:""};
function showReadResult(si,li,r,heardRaw){
  const pct=Math.round(r.score*100),box=$("#fb-"+si+"-"+li);if(!box)return;track('story_sentence',{score:pct,lesson:STORIES[si].n});
  prog.say=prog.say||{};if(pct/100>(prog.say[skey(si,li)]||0)){prog.say[skey(si,li)]=pct/100;save()}
  const msg=pct>=90?"🎉 Tuyệt vời! Phát âm rất chuẩn.":pct>=70?"👍 Khá tốt. Luyện lại các từ màu đỏ nhé.":"💪 Chưa chuẩn lắm. Bấm vào từ đỏ để nghe mẫu rồi đọc chậm hơn.";
  box.innerHTML=`<div class="rr ${pct>=70?"good":"low"}"><div><b>${pct}%</b> ${msg}</div>${chipsHtml(r.marks)}${needHtml(r.marks)}
   <div class="stat">Máy nghe được: <span class="zh">${r.heard||"(không rõ)"}</span></div>${heardRaw!=null?diffBlock(heardRaw,rows(STORIES[si].l)[li].split("|")[0]):""}</div>`;
  const bd=$("#bd-"+si+"-"+li);if(bd)bd.textContent=Math.round(storyBest(si,li)*100)+"%";
  const av=$("#avg-"+si);if(av)av.textContent=storyAvg(si);
}
function storyAvg(si){const n=rows(STORIES[si].l).length;let s=0,c=0;for(let li=0;li<n;li++){const b=storyBest(si,li);if(b){s+=b;c++}}return c?"Điểm đọc từng câu: "+Math.round(s/c*100)+"% ("+c+"/"+n+" câu)":""}
const fullBadge=si=>{const f=(prog.full||{})[STORIES[si].zh];return f?`Đọc liền: ${f.p}% · trôi chảy ${f.f}%`:""};

// ---- Ghi âm và nhận dạng: dùng chung cho một câu và cho cả truyện ----
function finishRec(){          // bấm "Dừng và chấm"
  const S=rec;if(!S||S.done)return;
  S.userStop=true;clearTimeout(S.timer);clearInterval(S.tick);
  try{S.r.stop()}catch(e){}
  setTimeout(()=>{if(!S.done&&S.r.onend)S.r.onend()},2500);   // phòng khi trình duyệt không báo kết thúc
}
// key: "si-li" hoặc "si-all"; quiet: số ms im lặng thì tự chấm; maxMs: thời gian tối đa; onResult(text, info)
function recordTarget(key,target,o,onResult){
  const btn=$("#mic-"+key),box=$("#fb-"+key);
  if(rec&&recKey===key){finishRec();return}                       // bấm lần nữa = dừng và chấm
  if(!SRC){toast("Trình duyệt này chưa hỗ trợ nhận dạng giọng nói. Hãy dùng Chrome hoặc Safari (Mac, iPhone).");return}
  stopSpeak();stopRec();
  const S={prefix:"",cur:"",userStop:false,done:false,fatal:false,r:null,timer:0,tick:0,startAt:Date.now(),lastAt:0,stamps:[],listenAt:0,confs:[],curConf:{}};
  rec=S;recKey=key;
  const live=()=>{box.innerHTML=`<div class="stat">🎙 Hãy đọc to${o.whole?" cả truyện, liền một mạch":" cả câu"}. <b>Đọc xong bấm nút đỏ “Dừng và chấm”, hoặc chờ khoảng ${Math.round(o.quiet/1000)} giây, web sẽ tự chấm.</b></div><div class="stat">Máy đang nghe: <span class="zh">${esc(S.prefix+S.cur)||"…"}</span></div>`};
  const finalize=()=>{
    if(S.done)return;S.done=true;clearTimeout(S.timer);clearInterval(S.tick);
    if(rec===S){rec=null;recKey=""}idleMics();
    if(S.fatal)return;
    const text=(S.prefix+S.cur).trim();
    if(!text){if(o.onEmpty)o.onEmpty();else box.innerHTML=`<div class="rr low">Chưa nghe thấy giọng bạn. Bấm 🎤 và đọc to hơn nhé.</div>`;return}
    S.confs.push(...Object.values(S.curConf));S.curConf={};
    const st=S.stamps;let pauses=0,longest=0;
    for(let i=1;i<st.length;i++){const g=st[i]-st[i-1];if(g>2000)pauses++;if(g>longest)longest=g}
    onResult(text,{pauses,longest,dur:st.length>1?st[st.length-1]-st[0]:0,first:st[0]||0,listenAt:S.listenAt,conf:S.confs.length?S.confs.reduce((x,y)=>x+y,0)/S.confs.length:null});
  };
  const start=()=>{
    const r=new SRC();S.r=r;
    r.lang="zh-TW";r.continuous=true;r.interimResults=true;r.maxAlternatives=3;
    r.onstart=()=>{if(!S.listenAt)S.listenAt=Date.now();idleMics();btn.classList.add("rec");btn.textContent="⏹ Dừng và chấm";live()};
    r.onresult=e=>{
      const cur=[...e.results].map(x=>bestAlt(target,[...x].map(y=>y.transcript))).join("");
      [...e.results].forEach((x,i)=>{if(x.isFinal&&x[0].confidence>0)S.curConf[i]=x[0].confidence});
      if(cur!==S.cur){S.stamps.push(Date.now());S.lastAt=Date.now()}
      S.cur=cur;live();
    };
    r.onerror=e=>{
      if(e.error==="no-speech"||e.error==="aborted")return;       // im lặng lâu: bỏ qua, bật lại nghe tiếp
      S.fatal=true;
      const m={"not-allowed":"Bạn chưa cho phép dùng micro. Bấm biểu tượng khóa ở thanh địa chỉ, cho phép Micro rồi thử lại.","service-not-allowed":"Trình duyệt không cho dùng nhận dạng giọng nói ở đây.","audio-capture":"Không tìm thấy micro.","network":"Cần có mạng: Chrome gửi âm thanh lên Google để nhận dạng."}[e.error];
      box.innerHTML=`<div class="rr low">${m||"Lỗi nhận dạng giọng nói ("+e.error+")."}</div>`;
    };
    r.onend=()=>{
      if(S.done)return;
      S.confs.push(...Object.values(S.curConf));S.curConf={};
      S.prefix+=S.cur;S.cur="";
      if(S.userStop||S.fatal){finalize();return}
      try{start()}catch(x){finalize()}                            // trình duyệt tự ngắt khi bạn ngừng nói một lúc → bật lại, tiếp tục nghe cho đến khi bạn bấm dừng
    };
    try{r.start()}catch(e){toast("Không bật được micro: "+e.message);S.fatal=true;finalize()}
  };
  start();
  S.tick=setInterval(()=>{
    if(S.done||S.userStop)return;
    const said=(S.prefix+S.cur).trim();
    if(said&&S.lastAt&&Date.now()-S.lastAt>o.quiet)finishRec();          // đã đọc xong, im lặng đủ lâu → tự chấm
    else if(!said&&Date.now()-S.startAt>o.idle)finishRec();               // quá lâu không nghe gì → dừng
  },500);
  S.timer=setTimeout(()=>{if(!S.done)finishRec()},o.max);
}
function readAloud(si,li){      // luyện từng câu
  const target=rows(STORIES[si].l)[li].split("|")[0];
  recordTarget(si+"-"+li,target,{quiet:4000,idle:15000,max:120000},text=>showReadResult(si,li,compareRead(target,text),text));
}

// ---- Ghép cả truyện: đọc liền một mạch, chấm từng câu + độ trôi chảy ----
function fluencyOf(info,okChars,minDur=3000){
  if(info.dur<minDur||!okChars)return null;
  const cpm=Math.round(okChars/(info.dur/60000));
  const speed=Math.min(100,cpm);                                    // từ 100 chữ/phút trở lên là đủ nhanh cho người học
  const penalty=Math.min(50,info.pauses*8)+(info.longest>4000?Math.min(20,Math.round((info.longest-4000)/500)):0);
  return{cpm,score:Math.max(0,Math.min(100,Math.round(speed-penalty)))};
}
function readWhole(si){
  const ls=rows(STORIES[si].l).map(r=>r.split("|")[0]),target=ls.join("");
  recordTarget(si+"-all",target,{whole:true,quiet:7000,idle:20000,max:300000},(text,info)=>{
    const A=alignHits(target,text),box=$("#fb-"+si+"-all");let off=0;
    const per=ls.map(s=>{const len=[...s].filter(isHan).length,r={s,score:sentScore(A,off,len),marks:wordMarks(s,A,off)};off+=len;return r});
    const pct=Math.round(A.score*100),fl=fluencyOf(info,A.ok),flu=fl?fl.score:null;track('story_whole',{pronunciation:pct,fluency:flu,lesson:STORIES[si].n});
    prog.full=prog.full||{};const old=prog.full[STORIES[si].zh];
    if(!old||pct>old.p){prog.full[STORIES[si].zh]={p:pct,f:flu==null?(old?old.f:0):flu};save()}
    const bd=$("#full-"+si);if(bd)bd.textContent=fullBadge(si);
    const msgP=pct>=90?"Phát âm rất chuẩn.":pct>=70?"Phát âm khá tốt, luyện lại vài chỗ đỏ.":"Cần luyện thêm phát âm từng câu rồi ghép lại.";
    const msgF=flu==null?"Đọc thêm một chút để đo độ trôi chảy.":flu>=80?"Đọc khá trôi chảy.":flu>=50?"Hơi ngập ngừng, thử đọc liền mạch hơn.":"Còn ngắt quãng nhiều, hãy luyện từng câu rồi ghép lại.";
    box.innerHTML=`<div class="rr ${pct>=70?"good":"low"}">
      <div class="big"><b>${pct}%</b> phát âm${flu==null?"":` · <b>${flu}%</b> trôi chảy`}</div>
      <div>${msgP} ${msgF}</div>
      <div class="stat">⏱ ${(info.dur/1000).toFixed(0)} giây${fl?` · khoảng ${fl.cpm} chữ/phút (đọc thoải mái: 100–200)`:""} · ${info.pauses} lần ngập ngừng trên 2 giây${info.longest>2000?`, lâu nhất ${(info.longest/1000).toFixed(1)} giây`:""}</div>
      <div class="stat" style="margin-top:8px"><b>Từng câu:</b></div>
      ${per.map((p,i)=>`<div class="sres"><div class="row"><b class="${p.score>=0.7?"okc":"badc"}">${Math.round(p.score*100)}%</b><span class="zh tap" style="font-size:18px" onclick="speak('${p.s}')">${p.s}</span></div>${chipsHtml(p.marks)}</div>`).join("")}
      <div class="stat">Máy nghe được: <span class="zh">${A.H.join("")||"(không rõ)"}</span></div>
      <div class="stat">Điểm trôi chảy dựa vào tốc độ và số lần dừng lâu giữa các lần nhận dạng, chỉ mang tính tham khảo.</div></div>`;
  });
}
function playStory(si){toast("🔊 Đang đọc…");speakSeq(rows(STORIES[si].l).map(r=>({t:r.split("|")[0],tag:"m",pitch:1})))}

  });

/* ============ SỬA CÂU: sửa lỗi ngữ pháp thường gặp + dựng lại câu theo ý người nói ============ */
const cleanHan=s=>[...digHan(s)].map(c=>S2T[c]||c).filter(isHan).join("");
const PR="(?:我們|你們|他們|我|你|他|她)";
const ADJS="好吃|好喝|好看|好玩|漂亮|便宜|乾淨|貴|冷|熱|忙|累|難|近|遠|甜|辣|快|慢|大|小|高|矮|涼|暖和";
const TIMEW="今天|明天|昨天|現在|晚上|早上|下午|中午|每天|週末";
const FIXES=[
  {re:/(.)\1+/g,test:m=>"我你他是有在也都很不".includes(m[1]),rep:"$1",tip:"Bạn đang lặp từ (nói lắp), chỉ cần nói một lần."},
  {re:/(叫|姓)的/g,rep:"$1",tip:"Không dùng 的 sau 叫/姓: 我叫大明."},
  {re:/二(個|杯|碗|張|支|條|件|雙|本|家|次)/g,rep:"兩$1",tip:"Trước lượng từ dùng 兩 (hai), không dùng 二: 兩個, 兩杯…"},
  {re:/不有/g,rep:"沒有",tip:"Phủ định của 有 là 沒有, không nói 不有."},
  {re:/沒是/g,rep:"不是",tip:"Phủ định của 是 là 不是, không nói 沒是."},
  {re:/是也/g,rep:"也是",tip:"也 (cũng) đứng trước động từ: 我也是學生."},
  {re:/是都/g,rep:"都是",tip:"都 (đều) đứng trước động từ: 我們都是學生."},
  {re:new RegExp("^("+PR+")(越南人|美國人|日本人|臺灣人|中國人|學生|老師|同學|醫生)$"),rep:"$1是$2",tip:"Danh từ chỉ quốc tịch/nghề nghiệp làm vị ngữ cần 是: 我是學生."},
  {re:new RegExp("是很(?=" +ADJS+ ")","g"),rep:"很",tip:"Tính từ làm vị ngữ không dùng 是: 我很忙 (không nói 我是很忙)."},
  {re:new RegExp("比(.{1,6}?)很("+ADJS+")"),rep:"比$1$2",tip:"Trong câu so sánh 比 không dùng 很: 高鐵比火車快."},
  {re:/^(.{1,6})有(前面|後面|旁邊|上面|下面|裡面|外面)$/,rep:"$1在$2",tip:"Chỉ vị trí của một vật dùng 在: 圖書館在教室後面."},
  {re:/^(.{1,6})到(.{1,6})很(近|遠)$/,rep:"$1離$2很$3",tip:"Khoảng cách giữa hai nơi dùng 離: 我家離學校很近."},
  {re:new RegExp("^("+PR+")(.{2,8}?)((?:"+TIMEW+")(?:[一二三四五六七八九十兩]+點(?:半|[一二三四五六七八九十]+分)?)?)$"),test:m=>/[去吃看喝做買上學玩打游睡起坐騎]/.test(m[2]),rep:"$1$3$2",tip:"Từ chỉ thời gian đứng trước động từ: 我明天去學校."},
  {re:new RegExp("^("+PR+")(吃飯|看書|工作|上課|睡覺|喝茶|學中文|做飯|看電影|運動|吃晚飯|吃早飯)在(家|學校|圖書館|咖啡店|公司|宿舍|這裡|那裡)$"),rep:"$1在$3$2",tip:"在 + địa điểm đứng trước động từ: 我在家吃飯."},
  {re:/(兩|三|四|五|六|七|八|九)(哥哥|姐姐|弟弟|妹妹|朋友|學生|老師|同學|人)/g,rep:"$1個$2",tip:"Giữa số và danh từ cần lượng từ 個: 兩個哥哥, 四個人."},
  {re:/一(哥哥|姐姐|弟弟|妹妹|朋友|學生|老師|同學)/g,rep:"一個$1",tip:"Giữa số và danh từ cần lượng từ 個: 一個哥哥."},
  {re:/是([一二三四五六七八九十兩]+)歲/,rep:"$1歲",tip:"Nói tuổi không dùng 是: 我二十五歲."},
  {re:/^(我|他|她)(會)?說(中文|越南話|英文)(很|不)(好|錯|流利)$/,rep:"$1$3說得$4$5",tip:"Đánh giá mức độ của hành động dùng V得: 我中文說得很好."},
  {re:/(.+?)還是(.+)/,rep:"$1",tip:"還是 chỉ dùng khi HỎI lựa chọn. Khi trả lời, hãy chọn một đáp án."},
  {re:/嗎$/,rep:"",tip:"Câu trả lời không cần 嗎 (嗎 dùng khi đặt câu hỏi)."}
];
function grammarFix(text){
  let t=cleanHan(text);const tips=[];
  FIXES.forEach(f=>{
    const re=new RegExp(f.re.source,f.re.flags),m=t.match(new RegExp(f.re.source,f.re.flags.replace("g","")));
    if(!m||(f.test&&!f.test(m)))return;
    const n=t.replace(re,f.rep);if(n!==t){tips.push(f.tip);t=n}
  });
  // thiếu 很 trước tính từ ở cuối câu: 今天冷 → 今天很冷
  const m=t.match(new RegExp("^(.+?)("+ADJS+")$"));
  if(m&&!/(很|太|真|不|最|更|非常|比較|有點|又|覺得|比|得|一點)$/.test(m[1])&&!/(比|沒有)/.test(m[1])){t=m[1]+"很"+m[2];tips.push("Tính từ làm vị ngữ thường cần 很 phía trước: 今天很冷.")}
  return{text:t,tips};
}
// So sánh hai chuỗi chữ Hán theo từng chữ: a = bạn nói (chữ thừa gạch đỏ), b = câu đúng (chữ thêm/sửa tô xanh)
function diffHtml(a,b){
  const A=[...a],B=[...b],n=A.length,m=B.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=A[i-1]===B[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const ra=[],rb=[];let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&A[i-1]===B[j-1]){ra.push(esc(A[i-1]));rb.push(esc(B[j-1]));i--;j--}
    else if(j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])){rb.push(`<span class="ins">${esc(B[j-1])}</span>`);j--}
    else{ra.push(`<span class="del">${esc(A[i-1])}</span>`);i--}
  }
  return{a:ra.reverse().join(""),b:rb.reverse().join("")};
}
// Khối "Bạn nói / Đúng là" dùng khi đọc theo một câu mẫu cố định
function diffBlock(heard,target){
  const H=cleanHan(heard),T=cleanHan(target);
  if(!H||H===T)return"";
  const d=diffHtml(H,T);
  return `<div class="fix"><div class="stat"><b>✏️ So với câu đúng</b></div><div>Bạn nói: <span class="zh">${d.a}</span></div><div>Đúng là: <span class="zh">${d.b}</span></div><div class="py">${annotate(T).html}</span></div></div>`;
}
// Khối sửa câu cho vấn đáp: chỉ sửa lỗi ngữ pháp, trên chính lời người nói (không dùng câu mẫu)
function fixBlock(Q,text,E){
  const g=grammarFix(text),heard=cleanHan(text),corrected=g.text;
  if(!g.tips.length)return `<div class="fix ok"><b>✅ Câu của bạn đúng ngữ pháp.</b> Chỉ cần đúng ngữ pháp và phát âm là tốt, không cần giống câu mẫu.</div>`;
  const d=diffHtml(heard,corrected);
  return `<div class="fix"><div class="stat"><b>✏️ Sửa lại câu của bạn</b></div>
   <div>Bạn nói: <span class="zh">${d.a}</span></div>
   <div>Sửa thành: <span class="zh tap" onclick="speak('${corrected}')">${d.b}。</span> ${spkBtn(corrected)}</div>
   <div class="py" id="fix-py">${annotate(corrected).html}</div>
   <ul class="tips">${g.tips.map(n=>`<li>${n}</li>`).join("")}</ul>
   <div class="row" style="margin-top:6px"><button class="b mic" data-label="🎤 Đọc lại câu đã sửa" id="mic-qa3" onclick="qaFixRead('${corrected}')">🎤 Đọc lại câu đã sửa</button></div><div id="fb-qa3"></div></div>`;
}
function qaFixRead(target){
  recordTarget("qa3",target,{quiet:4000,idle:15000,max:60000},text=>{
    const r=compareRead(target,text),pct=Math.round(r.score*100);
    $("#fb-qa3").innerHTML=`<div class="rr ${pct>=70?"good":"low"}"><div><b>${pct}%</b> ${pct>=90?"🎉 Đọc rất chuẩn.":pct>=70?"👍 Khá tốt.":"💪 Bấm từ đỏ để nghe mẫu rồi đọc lại."}</div>${chipsHtml(r.marks)}${needHtml(r.marks)}${diffBlock(text,target)}</div>`;
  });
}

/* ============ VẤN ĐÁP PHẢN XẠ: web hỏi bằng giọng nói, bạn trả lời ngay ============ */
const QA=rows(QA_DATA).map(r=>{const p=r.split("|");return{n:+p[0],q:p[1],qpy:p[2],qvi:p[3],a:p[4],apy:p[5],avi:p[6],keys:p[7].split(";").map(g=>g.split("/"))}});
let qaHide=true,qaAuto=true,qaCur=null,qaSess=null,qaTimer=0,qaLast=null,qaSeen=[];
const QA_LEN=10,QA_WAIT=9;       // 10 câu mỗi phiên; 9 giây để bắt đầu trả lời
function qaPick(){
  let pool=QA.filter(q=>inL(q.n));if(!pool.length)pool=QA;
  let fresh=pool.filter(q=>!qaSeen.includes(q.q));
  if(!fresh.length){qaSeen=[];fresh=pool.filter(q=>q.q!==(qaLast&&qaLast.q));if(!fresh.length)fresh=pool}
  const q=fresh[Math.random()*fresh.length|0];qaSeen.push(q.q);return q;
}
function qaView(){
  clearInterval(qaTimer);
  const t=prog.qa||{done:0,sum:0};
  $("#app").innerHTML=`<div class="card tip">🎙 <b>Vấn đáp phản xạ:</b> web <b>hỏi bằng giọng nói</b> (tiếng Trung), bạn <b>trả lời ngay</b> bằng tiếng Trung. Web tự bật micro sau khi hỏi xong và tính <b>thời gian phản xạ</b>. Bạn <b>không cần nói giống câu mẫu</b>: chỉ cần câu <b>đúng ngữ pháp</b> và <b>phát âm rõ</b>. Sau mỗi câu, web chấm <b>ngữ pháp</b>, <b>phản xạ</b>, <b>độ rõ phát âm</b> và <b>độ trôi chảy</b>; nếu có lỗi ngữ pháp, web <b>sửa ngay trên câu bạn vừa nói</b>. Câu mẫu chỉ để tham khảo. Câu hỏi lấy theo bài đang chọn ở ô “Phạm vi”.${SRC?"":" <b>Trình duyệt này chưa hỗ trợ nhận dạng giọng nói, hãy mở bằng Chrome hoặc Safari.</b>"}</div>
  <div class="card"><div class="row"><label><input type="checkbox" ${qaHide?"checked":""} onchange="qaHide=this.checked"> Chỉ nghe, ẩn chữ câu hỏi (luyện nghe)</label><label><input type="checkbox" ${qaAuto?"checked":""} onchange="qaAuto=this.checked"> Tự bật micro sau khi hỏi</label></div>
  <div class="row" style="margin-top:12px"><button class="b p" onclick="qaStart(${QA_LEN})">▶ Bắt đầu phiên ${QA_LEN} câu</button><button class="b" onclick="qaStart(1)">🔀 Hỏi 1 câu ngẫu nhiên</button></div>
  <div class="stat" style="margin-top:10px">Có ${QA.filter(q=>inL(q.n)).length} câu hỏi trong phạm vi đang chọn.${t.done?` Bạn đã trả lời ${t.done} câu, điểm trung bình ${Math.round(t.sum/t.done)}%.`:""}</div></div><div id="qa-stage"></div>`;
}
function qaStart(n){qaSess={n,i:0,res:[]};track('qa_start',{questions:n});qaAsk()}
function qaAsk(){
  stopSpeak();stopRec();clearInterval(qaTimer);
  qaCur=qaPick();qaLast=qaCur;const Q=qaCur,k=qaSess?qaSess.i+1:1,N=qaSess?qaSess.n:1;
  const stage=$("#qa-stage");if(!stage)return;
  stage.innerHTML=`<div class="card"><div class="stat">Câu ${k}/${N} · ${lesTag(Q.n)}</div>
   <div id="qa-q" class="qa-q">${qaHide?"🔊 Nghe kỹ câu hỏi…":`<span class="zh tap" onclick="speak('${Q.q}')">${Q.q}</span>`}</div>

   <div class="row" style="margin-top:10px"><button class="b" onclick="qaReplay()">🔊 Nghe lại câu hỏi</button><button class="b" onclick="qaShowQ()">👁 Hiện chữ</button>

function qaPlayQuestion(after){
  const Q=qaCur;
  playClip(Q.q,{tag:"m",onend:()=>{if(qaCur===Q&&after)after()},onfail:()=>{if(qaCur===Q)say(Q.q,{onend:()=>{if(qaCur===Q&&after)after()}})}});
}
function qaReplay(){stopRec();clearInterval(qaTimer);$("#qa-timer").textContent="";$("#fb-qa").innerHTML="";qaPlayQuestion(null)}
function qaShowQ(){const Q=qaCur;if(!Q)return;$("#qa-q").innerHTML=`<span class="zh tap" onclick="speak('${Q.q}')">${Q.q}</span>`;$("#qa-hint").innerHTML=`<div class="py">${Q.qpy}</div><div class="vi">${Q.qvi}</div>`}
function qaSkip(){stopRec();clearInterval(qaTimer);qaRecord(null);qaNextStep()}
function qaAnswer(auto){
  const Q=qaCur;if(!Q)return;
  if(!SRC){toast("Trình duyệt này chưa hỗ trợ nhận dạng giọng nói. Hãy dùng Chrome hoặc Safari.");return}
  clearInterval(qaTimer);
  const timerEl=$("#qa-timer");
  recordTarget("qa","",{quiet:2500,idle:QA_WAIT*1000,max:40000,qa:true,
    onEmpty:()=>{clearInterval(qaTimer);timerEl.textContent="";qaResult(null,null)}},
   (text,info)=>{clearInterval(qaTimer);timerEl.textContent="";qaResult(text,info)});
  qaTimer=setInterval(()=>{                       // đếm ngược 9 giây để bắt đầu nói
    const S=rec;if(!S||recKey!=="qa"||!S.listenAt){return}
    if(S.stamps.length){timerEl.textContent="🎙 Đang nghe câu trả lời… (im lặng khoảng 2 giây thì web tự chấm)";return}
    const left=Math.max(0,QA_WAIT-(Date.now()-S.listenAt)/1000);
    timerEl.innerHTML=`⏱ Trả lời ngay! Còn <b>${left.toFixed(0)}</b> giây`;
  },300);
}
function evalAnswer(Q,text,info){
  const H=normHan(text).join(""),G=grammarFix(text);
  const matched=Q.keys.map(g=>g.some(k=>H.includes(normHan(k).join(""))));
  const gm=matched.filter(Boolean).length/Q.keys.length;
  const grammar=H.length<2?50:Math.max(40,100-25*G.tips.length);          // mỗi lỗi ngữ pháp trừ 25 điểm
  const clarity=info.conf!=null?Math.round(info.conf*100):null;
  const lat=info.first&&info.listenAt?Math.max(0,(info.first-info.listenAt)/1000):null;
  const reflex=lat==null?null:lat<=2?100:Math.max(0,Math.round(100-(lat-2)/6*100));
  const fl=fluencyOf(info,H.length,1500);
  const parts=[grammar,clarity,reflex,fl?fl.score:null].filter(x=>x!=null);   // đúng ngữ pháp và phát âm là đủ; ý câu trả lời không bị trừ điểm
  return{H,matched,gm,grammar,errs:G.tips.length,clarity,lat,reflex,fl,overall:Math.round(parts.reduce((x,y)=>x+y,0)/parts.length)};
}
function qaRecord(E){
  if(!qaSess)return;
  qaSess.res.push(E?{q:qaCur.q,overall:E.overall,content:E.grammar,lat:E.lat,gm:E.gm}:{q:qaCur.q,overall:0,content:0,lat:null,gm:0,skip:true});
  prog.qa=prog.qa||{done:0,sum:0};prog.qa.done++;prog.qa.sum+=E?E.overall:0;save();
}

  const Q=qaCur,box=$("#fb-qa");if(!Q||!box)return;

  const sample=`<details class="qa-sample"><summary class="stat"><b>Xem câu trả lời mẫu (chỉ để tham khảo)</b></summary><div class="row"><span class="zh tap" style="font-size:22px" onclick="speak('${Q.a}')">${Q.a}</span>${spkBtn(Q.a)}</div><div class="py">${Q.apy}</div><div class="vi">${Q.avi}</div>
    <div class="row" style="margin-top:8px"><button class="b mic" data-label="🎤 Đọc theo câu mẫu" id="mic-qa2" onclick="qaShadow()">🎤 Đọc theo câu mẫu</button></div><div id="fb-qa2"></div></details>`;
  const last=qaSess&&qaSess.i+1>=qaSess.n;
  const nextBtn=`<div class="row" style="margin-top:12px"><button class="b p" onclick="qaNextStep()">${last?"🏁 Xem tổng kết":"Câu tiếp ▶"}</button></div>`;
  if(!E){box.innerHTML=`<div class="rr low"><div class="big">⏱ Chưa kịp trả lời</div><div>Hãy thử nói bất kỳ câu nào bằng tiếng Trung ngay khi nghe hỏi, dù chưa hoàn hảo. Phản xạ nhanh quan trọng hơn câu hoàn chỉnh.</div>${sample}${nextBtn}</div>`;return}
  const tips=[];
  tips.push(E.errs?`Ngữ pháp: có ${E.errs} lỗi, xem phần sửa bên dưới.`:"✅ Ngữ pháp đúng.");
  if(E.gm<1)tips.push("Ghi chú: câu trả lời hơi khác ý câu hỏi, nhưng ngữ pháp và phát âm đúng thì vẫn được điểm (không trừ điểm vì khác câu mẫu).");
  if(E.lat!=null)tips.push(E.lat<=2?`⚡ Phản xạ rất nhanh (${E.lat.toFixed(1)} giây).`:E.lat<=4?`👍 Phản xạ ổn (${E.lat.toFixed(1)} giây), cố gắng dưới 2 giây.`:`🐢 Phản xạ hơi chậm (${E.lat.toFixed(1)} giây). Hãy nói ngay một từ khóa trước, ví dụ “我…”.`);
  if(E.clarity!=null&&E.clarity<75)tips.push("Máy nghe chưa rõ: hãy nói chậm hơn, rõ thanh điệu và ở nơi yên tĩnh.");
  if(E.fl&&E.fl.score<50)tips.push("Còn ngắt quãng nhiều, thử nói liền mạch hơn.");
  box.innerHTML=`<div class="rr ${E.overall>=70?"good":"low"}"><div class="big"><b>${E.overall}%</b> tổng điểm</div>
   <div class="scoregrid"><div class="sc"><b>${E.grammar}%</b>Ngữ pháp</div><div class="sc"><b>${E.reflex==null?"—":E.reflex+"%"}</b>Phản xạ${E.lat==null?"":` (${E.lat.toFixed(1)}s)`}</div><div class="sc"><b>${E.clarity==null?"—":E.clarity+"%"}</b>Độ rõ phát âm</div><div class="sc"><b>${E.fl?E.fl.score+"%":"—"}</b>Trôi chảy</div></div>
   <ul class="tips">${tips.map(t=>`<li>${t}</li>`).join("")}</ul>
   <div class="stat">Máy nghe được: <span class="zh">${annotate(text).html}</span></div>${fixBlock(Q,text,E)}${sample}${nextBtn}</div>`;
}
function qaShadow(){
